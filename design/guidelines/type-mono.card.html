<!-- @dsCard group="Type" viewport="700x180" subtitle="IBM Plex Mono — always UPPERCASE, wide-tracked" name="Metadata / mono" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;font-family:var(--font-ui);background:var(--paper-linen);color:var(--ink-body)}
.row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.mono{font-family:var(--font-mono);text-transform:uppercase;color:var(--ink-faint)}
.s1{font-size:11px;letter-spacing:0.22em}
.s2{font-size:10.5px;letter-spacing:0.18em}
.s3{font-size:9.5px;letter-spacing:0.14em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc-sage);display:inline-block}
.rule{flex:1;height:1px;border-bottom:1px dashed var(--line-dashed)}
</style></head><body>
<div class="row"><span class="mono s1">Kai's Flow · Sun 05 Jul · Synced <span class="dot"></span></span></div>
<div class="row"><span class="mono s2">Top 3 for today</span><span class="rule"></span></div>
<div class="row"><span class="mono s3">Prunus · Tasks</span><span class="mono s3" style="color:var(--acc-terra)">Overdue 3d</span><span class="mono s3">↻ Weekly</span></div>
</body></html>
