<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;font-family:var(--font-ui);background:var(--paper-linen);color:var(--ink-body)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
img{height:74px;width:auto;object-fit:contain;filter:var(--shadow-drop-sm)}
.lbl{font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-faint);text-align:center}
.lbl b{color:var(--ink-body);font-family:var(--font-ui);font-weight:500;letter-spacing:0;text-transform:none;font-size:11px;display:block;margin-bottom:2px}
</style></head><body>
<div class="grid">
  <div class="cell"><img src="../assets/flowers/clover/awake.png"><div class="lbl"><b>Clover</b>Chat</div></div>
  <div class="cell"><img src="../assets/flowers/hydrangea/light.png"><div class="lbl"><b>Hydrangea</b>Inbox</div></div>
  <div class="cell"><img src="../assets/flowers/daisy/midday.png"><div class="lbl"><b>Daisy</b>Calendar</div></div>
  <div class="cell"><img src="../assets/flowers/cherry/bloom.png"><div class="lbl"><b>Cherry</b>Tasks</div></div>
  <div class="cell"><img src="../assets/flowers/wisteria/p60.png"><div class="lbl"><b>Wisteria</b>Projects</div></div>
  <div class="cell"><img src="../assets/flowers/fern/unfurl2.png"><div class="lbl"><b>Fern</b>Docs</div></div>
</div>
</body></html>
