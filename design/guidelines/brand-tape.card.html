<!-- @dsCard group="Brand" viewport="700x180" subtitle="Washi tape — the recurring decoration on cards & panels" name="Washi tape" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:22px;font-family:var(--font-ui);background:var(--paper-linen);color:var(--ink-body)}
.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.tape{width:72px;height:16px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,0.3) 0 4px,transparent 4px 8px);border-radius:1px;box-shadow:var(--shadow-crisp)}
.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-faint);text-align:center;margin-top:6px;display:block}
.a{background-color:rgba(138,154,126,0.4);transform:rotate(-2deg)}
.b{background-color:rgba(212,168,176,0.4);transform:rotate(3deg)}
.c{background-color:rgba(168,160,190,0.4);transform:rotate(-1.5deg)}
.d{background-color:rgba(154,180,190,0.4);transform:rotate(2deg)}
.e{background-color:rgba(201,165,90,0.5);transform:rotate(-1deg)}
.wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
</style></head><body>
<div class="row">
  <div class="wrap"><div class="tape a"></div><span class="lbl">Sage</span></div>
  <div class="wrap"><div class="tape b"></div><span class="lbl">Blossom</span></div>
  <div class="wrap"><div class="tape c"></div><span class="lbl">Lavender</span></div>
  <div class="wrap"><div class="tape d"></div><span class="lbl">Hydrangea</span></div>
  <div class="wrap"><div class="tape e"></div><span class="lbl">Gold</span></div>
</div>
</body></html>
