<!-- @dsCard group="Spacing" viewport="700x180" subtitle="4px base · 8/12/16/24 rhythm" name="Spacing scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;font-family:var(--font-ui);background:var(--paper-linen);color:var(--ink-body)}
.row{display:flex;gap:22px;align-items:flex-end}
.b{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.bar{background:var(--acc-sage);height:22px;border-radius:2px}
.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint)}
</style></head><body>
<div class="row">
  <div class="b"><div class="bar" style="width:4px"></div><div class="lbl">4 · sp-1</div></div>
  <div class="b"><div class="bar" style="width:8px"></div><div class="lbl">8 · sp-2</div></div>
  <div class="b"><div class="bar" style="width:12px"></div><div class="lbl">12 · sp-3</div></div>
  <div class="b"><div class="bar" style="width:16px"></div><div class="lbl">16 · sp-4</div></div>
  <div class="b"><div class="bar" style="width:24px"></div><div class="lbl">24 · sp-6</div></div>
  <div class="b"><div class="bar" style="width:40px"></div><div class="lbl">40 · section</div></div>
  <div class="b"><div class="bar" style="width:64px"></div><div class="lbl">64 · major</div></div>
</div>
</body></html>
