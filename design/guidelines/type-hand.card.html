<!-- @dsCard group="Type" viewport="700x180" subtitle="Caveat — marginalia only. A soft handwritten aside." name="Handwritten" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;font-family:var(--font-ui);background:var(--paper-linen);color:var(--ink-body)}
.hand{font-family:var(--font-hand);color:#7a745f;display:block}
.a{font-size:22px;transform:rotate(-1deg);display:inline-block}
.b{font-size:18px;transform:rotate(0.6deg);display:inline-block;margin-top:6px}
.c{font-size:15px;transform:rotate(-1.4deg);display:inline-block;margin-top:6px}
.note{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-faint);margin-top:14px}
</style></head><body>
<span class="hand a">a field journal of days ✿</span><br>
<span class="hand b">pressed &amp; kept, one day at a time</span><br>
<span class="hand c">leaves up — someone wrote</span>
<div class="note">Caveat · 400–600 · marginalia only · never in a control</div>
</body></html>
