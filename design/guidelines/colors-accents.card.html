<!-- @dsCard group="Colors" viewport="700x260" subtitle="One flower, one accent" name="Flower accents" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-ui);background:var(--paper-linen);color:var(--ink-body)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border:1px solid var(--line-card);border-radius:var(--radius-sharp);overflow:hidden;background:var(--paper-parchment);box-shadow:var(--shadow-crisp)}
.chip{height:56px}
.meta{padding:8px 10px;border-top:1px dashed var(--line-dashed);font-family:var(--font-mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-faint)}
.meta b{display:block;color:var(--ink-body);font-family:var(--font-ui);font-size:11.5px;letter-spacing:0;text-transform:none;font-weight:500;margin-bottom:2px}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#8A9A7E"></div><div class="meta"><b>Sage · leaves</b>#8A9A7E</div></div>
  <div class="sw"><div class="chip" style="background:#7A946E"></div><div class="meta"><b>Moss · projects</b>#7A946E</div></div>
  <div class="sw"><div class="chip" style="background:#B5654A"></div><div class="meta"><b>Terra · CTA</b>#B5654A</div></div>
  <div class="sw"><div class="chip" style="background:#D4A8B0"></div><div class="meta"><b>Blossom · tasks</b>#D4A8B0</div></div>
  <div class="sw"><div class="chip" style="background:#A8A0BE"></div><div class="meta"><b>Lavender · cal</b>#A8A0BE</div></div>
  <div class="sw"><div class="chip" style="background:#9AB4BE"></div><div class="meta"><b>Hydrangea · inbox</b>#9AB4BE</div></div>
  <div class="sw"><div class="chip" style="background:#C9A0A0"></div><div class="meta"><b>Clover · chat</b>#C9A0A0</div></div>
  <div class="sw"><div class="chip" style="background:#D4C78A"></div><div class="meta"><b>Buttercream · docs</b>#D4C78A</div></div>
</div>
</body></html>
