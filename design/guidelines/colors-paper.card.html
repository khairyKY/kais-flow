<!-- @dsCard group="Colors" viewport="700x180" subtitle="Light-mode paper ground" name="Paper" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-ui);background:var(--paper-linen);color:var(--ink-body)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sw{border:1px solid var(--line-card);border-radius:var(--radius-sharp);overflow:hidden;box-shadow:var(--shadow-crisp)}
.chip{height:70px}
.meta{padding:8px 10px;background:var(--paper-parchment);border-top:1px solid var(--line-card);font-family:var(--font-mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-faint)}
.meta b{display:block;color:var(--ink-body);font-family:var(--font-ui);font-size:11.5px;letter-spacing:0;text-transform:none;font-weight:500;margin-bottom:2px}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#EFE9DB"></div><div class="meta"><b>Linen</b>#EFE9DB · app bg</div></div>
  <div class="sw"><div class="chip" style="background:#FBF6E9"></div><div class="meta"><b>Parchment</b>#FBF6E9 · cards</div></div>
  <div class="sw"><div class="chip" style="background:#F6F0E1"></div><div class="meta"><b>Bone</b>#F6F0E1 · inputs</div></div>
  <div class="sw"><div class="chip" style="background:#EAE3D2"></div><div class="meta"><b>Sidebar</b>#EAE3D2 · rail</div></div>
  <div class="sw"><div class="chip" style="background:#F8EFD3"></div><div class="meta"><b>Goal</b>#F8EFD3 · top-3</div></div>
</div>
</body></html>
