<!-- @dsCard group="Type" viewport="700x200" subtitle="Source Serif 4 — headlines, quiet weight" name="Display" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;font-family:var(--font-ui);background:var(--paper-linen);color:var(--ink-body)}
.stack{display:flex;flex-direction:column;gap:6px}
.d1{font-family:var(--font-display);font-weight:500;font-size:44px;line-height:1;letter-spacing:-0.015em}
.d2{font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:-0.01em}
.d3{font-family:var(--font-display);font-weight:600;font-size:18px}
.mono{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px}
</style></head><body>
<div class="stack">
  <div class="d1">Sunday, July 5</div>
  <div class="d2">Kai's Flow</div>
  <div class="d3">Goal of the day</div>
</div>
<div class="mono">Source Serif 4 · 500 / 600 · sizes 44 / 26 / 18</div>
</body></html>
