<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#EFE9DB;color:#2a2420;font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");mix-blend-mode:multiply;opacity:0.6}
</style>
</helmet>
<div data-screen-label="Evening Ritual" style="width:1440px;height:1024px;margin:0 auto;position:relative;background:#EFE9DB;overflow:hidden">

  <div style="position:absolute;inset:0;filter:blur(3px)">
    <div style="position:absolute;left:0;top:0;bottom:0;width:238px;background:#EAE3D2;border-right:1px dashed #c9c1aa"></div>
    <div style="position:absolute;left:278px;top:74px;width:640px;height:150px;background:#FBF6E9;border:1px solid #e0d8c2;border-radius:3px"></div>
    <div style="position:absolute;left:278px;top:260px;width:640px;height:420px;background:#FBF6E9;border:1px solid #e0d8c2;border-radius:3px;opacity:0.7"></div>
    <div style="position:absolute;left:980px;top:74px;width:280px;height:480px;background:#FBF6E9;border:1px solid #e0d8c2;border-radius:3px;opacity:0.7"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(46,40,46,0.4)"></div>

  <div style="position:absolute;left:50%;top:50%;width:460px;transform:translate(-50%,-50%);background:rgba(251,246,233,0.85);backdrop-filter:blur(9px);border:1px solid rgba(224,216,194,0.9);border-radius:16px;box-shadow:0 2px 4px rgba(40,32,20,0.15),0 30px 70px rgba(30,26,34,0.45);overflow:hidden">
    <div style="height:5px;background:linear-gradient(90deg,#A8A0BE,#8E86A8 50%,#6E6888)"></div>

    <div style="padding:20px 24px 22px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#8b8471">Evening ritual · step 1/2</div>
        <button style="border:none;background:none;color:#8b8471;font-family:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0">skip</button>
      </div>

      <div style="display:flex;align-items:center;gap:14px;margin-top:14px">
        <img src="assets/clover/resting.png" alt="" style="height:34px;width:auto;object-fit:contain;flex:none">
        <span style="font-family:'Caveat',cursive;font-size:17px;color:#7a745f;transform:rotate(-1deg)">the garden is settling in for the night</span>
      </div>

      <h2 style="margin:18px 0 4px;font-family:'Source Serif 4',serif;font-weight:600;font-size:22px;color:#2a2420">Sweep today</h2>
      <p style="margin:0 0 12px;font-size:12.5px;color:#8b8471">Still open — finish or roll each one forward.</p>

      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="border:1px dashed #cfc7b0;border-radius:3px;padding:10px 13px;display:flex;align-items:center;gap:11px;flex-wrap:wrap">
          <span style="width:15px;height:15px;border:1.5px solid #bfb8a3;border-radius:4px;flex:none"></span>
          <span style="flex:1;min-width:140px;font-size:13.5px;color:#2a2420">Open task placeholder</span>
          <button style="border:1px solid #cfc7b0;background:#F6F0E1;color:#2a2420;font-family:inherit;font-size:11px;padding:4px 12px;border-radius:999px;cursor:pointer">done</button>
          <button style="border:none;background:none;color:#7c6a9a;font-family:inherit;font-size:11px;text-decoration:underline;cursor:pointer;padding:0">roll to tomorrow</button>
        </div>
        <div style="border:1px dashed #cfc7b0;border-radius:3px;padding:10px 13px;display:flex;align-items:center;gap:11px;flex-wrap:wrap">
          <span style="width:15px;height:15px;border:1.5px solid #bfb8a3;border-radius:4px;flex:none"></span>
          <span style="flex:1;min-width:140px;font-size:13.5px;color:#2a2420">Open task placeholder</span>
          <button style="border:1px solid #cfc7b0;background:#F6F0E1;color:#2a2420;font-family:inherit;font-size:11px;padding:4px 12px;border-radius:999px;cursor:pointer">done</button>
          <button style="border:none;background:none;color:#7c6a9a;font-family:inherit;font-size:11px;text-decoration:underline;cursor:pointer;padding:0">roll to tomorrow</button>
        </div>
        <div style="border:1px dashed #cfc7b0;border-radius:3px;padding:10px 13px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;opacity:0.55">
          <span style="width:15px;height:15px;border-radius:4px;background:#2a2420;display:inline-flex;align-items:center;justify-content:center;color:#F4F1EA;font-size:10px;flex:none">✓</span>
          <span style="flex:1;min-width:140px;font-size:13.5px;color:#a49d87;text-decoration:line-through">Swept just now</span>
          <img src="assets/cherry/fallen.png" alt="" style="height:18px;width:auto;opacity:0.8">
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px">
        <div style="display:flex;gap:7px">
          <span style="width:8px;height:8px;border-radius:50%;background:#B5654A;box-shadow:0 0 0 3px rgba(181,101,74,0.2)"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:#d8d0ba"></span>
        </div>
        <button style="border:none;background:#B5654A;color:#fff;font-family:inherit;font-size:13px;padding:10px 26px;border-radius:999px;cursor:pointer;box-shadow:0 2px 4px rgba(120,60,40,0.3)">Next</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1024}}"></script>
</body>
</html>
