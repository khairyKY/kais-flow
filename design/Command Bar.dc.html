<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#EFE9DB;color:#2a2420;font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");mix-blend-mode:multiply;opacity:0.6}
</style>
</helmet>
<div data-screen-label="Command Bar" style="width:1440px;height:1024px;margin:0 auto;position:relative;background:#EFE9DB;overflow:hidden">

  <div style="position:absolute;inset:0;filter:blur(3px)">
    <div style="position:absolute;left:0;top:0;bottom:0;width:238px;background:#EAE3D2;border-right:1px dashed #c9c1aa"></div>
    <div style="position:absolute;left:278px;top:74px;width:640px;height:150px;background:#FBF6E9;border:1px solid #e0d8c2;border-radius:3px"></div>
    <div style="position:absolute;left:278px;top:260px;width:520px;height:60px;background:#F8EFD3;border:1px solid #dcc48e;border-radius:3px"></div>
    <div style="position:absolute;left:278px;top:344px;width:640px;height:340px;background:#FBF6E9;border:1px solid #e0d8c2;border-radius:3px;opacity:0.7"></div>
    <div style="position:absolute;left:980px;top:74px;width:280px;height:480px;background:#FBF6E9;border:1px solid #e0d8c2;border-radius:3px;opacity:0.7"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(58,50,38,0.32)"></div>

  <div style="position:absolute;left:50%;top:96px;width:560px;margin-left:-280px;background:rgba(251,246,233,0.78);backdrop-filter:blur(9px);border:1px solid rgba(224,216,194,0.9);border-radius:16px;box-shadow:0 2px 4px rgba(40,32,20,0.15),0 30px 70px rgba(40,32,20,0.35);padding:22px 24px 18px;overflow:hidden">
    <img src="assets/fern/unfurl2.png" alt="" style="position:absolute;right:-14px;bottom:-22px;height:150px;width:auto;opacity:0.1;transform:rotate(8deg);pointer-events:none">

    <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.2em;text-transform:uppercase;color:#8b8471;margin-bottom:12px">Command bar · ⌘K</div>

    <div style="display:flex;align-items:center;gap:12px;border-bottom:1.5px solid #c9c1aa;padding-bottom:12px">
      <span style="font-family:'Source Serif 4',serif;font-size:21px;color:#2a2420">Call Omar tomorrow 3pm #shaheen<span style="display:inline-block;width:2px;height:22px;background:#B5654A;margin-left:2px;vertical-align:-3px"></span></span>
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#5a5170;background:rgba(168,160,190,0.2);border:1px solid rgba(168,160,190,0.55);padding:4px 10px;border-radius:999px">Tue 7 Jul · 3:00 PM</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#4d6650;background:rgba(138,154,126,0.2);border:1px solid rgba(138,154,126,0.55);padding:4px 10px;border-radius:999px">→ Project Shaheen</span>
      <span style="font-family:'Caveat',cursive;font-size:16px;color:#7a745f;margin-left:4px;transform:rotate(-1deg)">it knows where this goes</span>
    </div>

    <div style="margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:#a49d87">Enter = quick add · Ctrl+Enter = AI capture</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1024}}"></script>
</body>
</html>
