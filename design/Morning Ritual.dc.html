<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#EFE9DB;color:#2a2420;font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");mix-blend-mode:multiply;opacity:0.6}
</style>
</helmet>
<div data-screen-label="Morning Ritual" style="width:1440px;height:1024px;margin:0 auto;position:relative;background:#EFE9DB;overflow:hidden">

  <div style="position:absolute;inset:0;filter:blur(3px)">
    <div style="position:absolute;left:0;top:0;bottom:0;width:238px;background:#EAE3D2;border-right:1px dashed #c9c1aa"></div>
    <div style="position:absolute;left:278px;top:74px;width:640px;height:150px;background:#FBF6E9;border:1px solid #e0d8c2;border-radius:3px"></div>
    <div style="position:absolute;left:278px;top:260px;width:520px;height:60px;background:#F8EFD3;border:1px solid #dcc48e;border-radius:3px"></div>
    <div style="position:absolute;left:278px;top:344px;width:640px;height:340px;background:#FBF6E9;border:1px solid #e0d8c2;border-radius:3px;opacity:0.7"></div>
    <div style="position:absolute;left:980px;top:74px;width:280px;height:480px;background:#FBF6E9;border:1px solid #e0d8c2;border-radius:3px;opacity:0.7"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(58,50,38,0.34)"></div>

  <div style="position:absolute;left:50%;top:50%;width:460px;transform:translate(-50%,-50%);background:rgba(251,246,233,0.85);backdrop-filter:blur(9px);border:1px solid rgba(224,216,194,0.9);border-radius:16px;box-shadow:0 2px 4px rgba(40,32,20,0.15),0 30px 70px rgba(40,32,20,0.35);overflow:hidden">
    <div style="height:5px;background:linear-gradient(90deg,#E8C98A,#D9A46A 40%,#C9A0A0)"></div>

    <div style="padding:20px 24px 22px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#8b8471">Morning ritual · step 2/4</div>
        <button style="border:none;background:none;color:#8b8471;font-family:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0">skip</button>
      </div>

      <div style="display:flex;align-items:center;gap:14px;margin-top:14px">
        <div style="display:flex;align-items:flex-end;gap:6px;flex:none">
          <img src="assets/clover/awake.png" alt="" style="height:34px;width:auto;object-fit:contain">
          <img src="assets/clover/dewdrop.png" alt="" style="height:30px;width:auto;object-fit:contain">
          <img src="assets/clover/seedling.png" alt="" style="height:24px;width:auto;object-fit:contain;opacity:0.55">
          <img src="assets/clover/seedling.png" alt="" style="height:24px;width:auto;object-fit:contain;opacity:0.35">
        </div>
        <span style="font-family:'Caveat',cursive;font-size:17px;color:#7a745f;transform:rotate(-1deg)">two sprouts awake, two still sleeping</span>
      </div>

      <h2 style="margin:18px 0 4px;font-family:'Source Serif 4',serif;font-weight:600;font-size:22px;color:#2a2420">Pick your Top-3 <span style="font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:13px;color:#8b8471">(2/3)</span></h2>

      <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
        <div style="background:#F8EFD3;border:1px solid #dcc48e;border-radius:3px;padding:10px 13px;display:flex;align-items:center;gap:11px;transform:rotate(-0.3deg)">
          <span style="color:#B5654A;font-size:15px;line-height:1">★</span>
          <span style="flex:1;font-size:13.5px;color:#2a2420">Starred task placeholder</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#9a7b3a">picked</span>
        </div>
        <div style="background:#F8EFD3;border:1px solid #dcc48e;border-radius:3px;padding:10px 13px;display:flex;align-items:center;gap:11px;transform:rotate(0.25deg)">
          <span style="color:#B5654A;font-size:15px;line-height:1">★</span>
          <span style="flex:1;font-size:13.5px;color:#2a2420">Starred task placeholder</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#9a7b3a">picked</span>
        </div>
        <div style="border:1px dashed #cfc7b0;border-radius:3px;padding:10px 13px;display:flex;align-items:center;gap:11px">
          <span style="color:#d0c9b6;font-size:15px;line-height:1">☆</span>
          <span style="flex:1;font-size:13.5px;color:#2a2420">Candidate task placeholder</span>
          <button style="border:1px solid #cfc7b0;background:#F6F0E1;color:#2a2420;font-family:inherit;font-size:11px;padding:4px 12px;border-radius:999px;cursor:pointer">star</button>
        </div>
        <div style="border:1px dashed #cfc7b0;border-radius:3px;padding:10px 13px;display:flex;align-items:center;gap:11px">
          <span style="color:#d0c9b6;font-size:15px;line-height:1">☆</span>
          <span style="flex:1;font-size:13.5px;color:#2a2420">Candidate task placeholder</span>
          <button style="border:1px solid #cfc7b0;background:#F6F0E1;color:#2a2420;font-family:inherit;font-size:11px;padding:4px 12px;border-radius:999px;cursor:pointer">star</button>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px">
        <div style="display:flex;gap:7px">
          <span style="width:8px;height:8px;border-radius:50%;background:#8A9A7E"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:#B5654A;box-shadow:0 0 0 3px rgba(181,101,74,0.2)"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:#d8d0ba"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:#d8d0ba"></span>
        </div>
        <button style="border:none;background:#B5654A;color:#fff;font-family:inherit;font-size:13px;padding:10px 26px;border-radius:999px;cursor:pointer;box-shadow:0 2px 4px rgba(120,60,40,0.3)">Next</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1024}}"></script>
</body>
</html>
