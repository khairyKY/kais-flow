; Kai's Flow -- a plain test skin for the Widget feed. NOT the real design: it only proves the feed works in
; Rainmeter. Copy this KaisFlowTest folder into Documents\Rainmeter\Skins, set Link below (Settings >
; App & updates > Windows desktop > Create link), then load KaisFlowTest.ini from Rainmeter's Manage window.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=24,22,30,220

[Metadata]
Name=Kai's Flow (test)
Information=Today's goal, the next block and three tasks from your Kai's Flow Widget link, as plain text.

[Variables]
; Your Widget link, the whole https://...supabase.co/functions/v1/widget?t=kf_w_... address
Link=
; 0 hides titles ("Your goal", "A task", "Busy")
Names=1

[MeasureFeed]
Measure=WebParser
URL=#Link#&names=#Names#
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=60
Disabled=1
FinishAction=[!CommandMeasure MeasureScript "Parse()"]
OnRegExpErrorAction=[!CommandMeasure MeasureScript "Parse()"]
OnConnectErrorAction=[!CommandMeasure MeasureScript "Offline()"]

[MeasureScript]
Measure=Script
ScriptFile=#CURRENTPATH#KaisFlowTest.lua

[MeterText]
Meter=String
X=12
Y=10
W=320
ClipString=2
FontFace=Segoe UI
FontSize=10
FontColor=240,235,221
AntiAlias=1
DynamicVariables=1
Text=Loading...
