[Rainmeter]
Update=1000
AccurateText=1
Group=Glass | KaisFlow
LocalFont1=#@#Fonts\SF Pro Display.OTF
LocalFont2=#@#Fonts\SFPRODISPLAYBOLD.OTF
LocalFont3=#@#Fonts\SFPRODISPLAYMEDIUM.OTF
LocalFont4=#@#Fonts\SourceSerif4-var.ttf
LocalFont5=#@#KaisFlow\Fonts\CourierPrime-Regular.ttf
ContextTitle=Open Kai's Flow
ContextAction=[!CommandMeasure MeasureKF "Go('today')"]
ContextTitle2=Add or change my Widget link
ContextAction2=[!CommandMeasure MeasureInput "ExecuteBatch 1"]
ContextTitle3=-
ContextTitle4=Theme: Auto (7 PM - 6 AM)
ContextAction4=[!CommandMeasure MeasureKF "SetTheme('auto')"]
ContextTitle5=Theme: Day
ContextAction5=[!CommandMeasure MeasureKF "SetTheme('day')"]
ContextTitle6=Theme: Night
ContextAction6=[!CommandMeasure MeasureKF "SetTheme('night')"]
ContextTitle7=-
ContextTitle8=Rebuild glass (new wallpaper)
ContextAction8=["powershell" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "#@#make-backdrop.ps1"]

[Metadata]
Name=Kai's Flow - Today
Author=Kai
Information=Large (2x2): the goal of the day, Top 3 and today's tasks, tickable. Right-click > Theme: Auto, Day or Night. A click opens the desktop app, or the website when it isn't installed. Paper on glass (design-export/Desktop widgets.html, direction B). Data: the Widget link from Kai's Flow (Settings > App & updates > Windows desktop), pasted with "Add my link". Snaps to the Glass grid.
Version=1.1

[Variables]
Widget=Today
W=360
H=360
Radius=24
; where it first appears (then it stays where you drag it)
DefaultX=20
DefaultY=20
@Include=#@#GlassVars.inc
@Include2=#@#KaisFlow\KaisFlow.inc

@Include3=#@#Snap.inc
@Include4=#@#GlassCard.inc
@Include5=#@#KaisFlow\Paper.inc

; ---------------------------------------------------------------- header: the date, and how the day is going

[KFIcon]
Meter=Shape
X=328
Y=18
Group=Content
DynamicVariables=1
Shape=Ellipse 8,8,2.8 | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round
Shape2=Line 12.67,8,14.67,8 | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round
Shape3=Line 11.3,11.3,12.71,12.71 | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round
Shape4=Line 8,12.67,8,14.67 | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round
Shape5=Line 4.7,11.3,3.29,12.71 | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round
Shape6=Line 3.33,8,1.33,8 | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round
Shape7=Line 4.7,4.7,3.29,3.29 | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round
Shape8=Line 8,3.33,8,1.33 | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round
Shape9=Line 11.3,4.7,12.71,3.29 | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round

[TodayDate]
Meter=String
MeterStyle=sText
X=16
Y=16
FontFace=#Serif#
FontWeight=600
FontSize=15.75
Text=

[TodaySub]
Meter=String
MeterStyle=sText
X=16
Y=41
FontSize=9.75
FontColor=#KfMuted#
Text=

; ---------------------------------------------------------------- the goal of the day (widget.lua sizes the card to its title)

[GoalCard]
Meter=Shape
MeterStyle=sShape
X=16
Y=67
MouseOverAction=[!CommandMeasure MeasureKF "Over('#CURRENTSECTION#')"]
MouseLeaveAction=[!CommandMeasure MeasureKF "Out('#CURRENTSECTION#')"]
LeftMouseUpAction=[!CommandMeasure MeasureKF "Open('#CURRENTSECTION#')"]
MouseActionCursor=1

[GoalTape]
Meter=Image
ImageName=#@#KaisFlow\tape.png
X=155
Y=59
Group=Content

[GoalCb]
Meter=Shape
MeterStyle=sRowCb
X=28
Y=80
Hidden=0

[GoalTitle]
Meter=String
MeterStyle=sText
X=55
Y=79
W=247
ClipString=2
ClipStringH=36
FontFace=#Serif#
FontWeight=600
FontSize=11.25
Text=

[GoalStamp]
Meter=String
MeterStyle=sText
X=55
Y=101
W=247
ClipString=1
FontFace=#Mono#
FontSize=7.1
FontColor=#KfGold#
InlineSetting=CharacterSpacing | 0 | 1 | 0
Text=

