[Rainmeter]
Update=1000
AccurateText=1
Group=Glass | KaisFlow
LocalFont1=#@#Fonts\SF Pro Display.OTF
LocalFont2=#@#Fonts\SFPRODISPLAYBOLD.OTF
LocalFont3=#@#Fonts\SFPRODISPLAYMEDIUM.OTF
LocalFont4=#@#Fonts\SourceSerif4-var.ttf
LocalFont5=#@#KaisFlow\Fonts\CourierPrime-Regular.ttf
ContextTitle=Open Kai's Flow
ContextAction=["#AppURL#"]
ContextTitle2=Add or change my Widget link
ContextAction2=[!CommandMeasure MeasureInput "ExecuteBatch 1"]
ContextTitle3=Rebuild glass (after changing wallpaper)
ContextAction3=["powershell" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "#@#make-backdrop.ps1"]

[Metadata]
Name=Kai's Flow - Today
Author=Kai
Information=Large (2x2): the goal of the day, Top 3 and today's tasks, tickable. Paper on glass (design-export/Desktop widgets.html, direction B). Data: the Widget link from Kai's Flow (Settings > App & updates > Windows desktop), pasted with "Add my link". Snaps to the Glass grid.
Version=1.0

[Variables]
Widget=Today
W=360
H=360
Radius=24
; the header flower: the image's top-left (it has a 10 px clear margin all round)
PlantX=240
PlantY=-44
; where it first appears (then it stays where you drag it)
DefaultX=20
DefaultY=20
@Include=#@#GlassVars.inc
@Include2=#@#KaisFlow\KaisFlow.inc

@Include3=#@#Snap.inc
@Include4=#@#GlassCard.inc
@Include5=#@#KaisFlow\Paper.inc

; ---------------------------------------------------------------- header: the date, and how the day is going

[TodayDate]
Meter=String
MeterStyle=sText
X=16
Y=16
FontFace=#Serif#
FontWeight=600
FontSize=15.75
Text=

[TodaySub]
Meter=String
MeterStyle=sText
X=16
Y=41
FontSize=9.75
FontColor=#KfMuted#
Text=

; ---------------------------------------------------------------- the goal of the day (widget.lua sizes the card to its title)

[GoalCard]
Meter=Shape
MeterStyle=sShape
X=16
Y=67
MouseOverAction=[!CommandMeasure MeasureKF "Over('#CURRENTSECTION#')"]
MouseLeaveAction=[!CommandMeasure MeasureKF "Out('#CURRENTSECTION#')"]
LeftMouseUpAction=["#AppURL#"]
MouseActionCursor=1

[GoalTape]
Meter=Image
ImageName=#@#KaisFlow\tape.png
X=155
Y=59
Group=Content

[GoalCb]
Meter=Shape
MeterStyle=sRowCb
X=28
Y=80
Hidden=0

[GoalTitle]
Meter=String
MeterStyle=sText
X=55
Y=79
W=247
ClipString=2
ClipStringH=36
FontFace=#Serif#
FontWeight=600
FontSize=11.25
Text=

[GoalStamp]
Meter=String
MeterStyle=sText
X=55
Y=101
W=247
ClipString=1
FontFace=#Mono#
FontSize=7.1
FontColor=#KfGold#
InlineSetting=CharacterSpacing | 0 | 1 | 0
Text=

; the bud on the card: cherry-bud, in bloom once the goal is ticked
[GoalBud]
Meter=Image
X=302
Y=66
Group=Content

; ---------------------------------------------------------------- rows: Top 3 picks 2 and 3, then today's tasks (widget.lua places them)

[Row1Bg]
Meter=Shape
MeterStyle=sRowBg

[Row1Num]
Meter=String
MeterStyle=sRowNum

[Row1Cb]
Meter=Shape
MeterStyle=sRowCb

[Row1Title]
Meter=String
MeterStyle=sRowTitle

[Row1Meta]
Meter=String
MeterStyle=sRowMeta
InlinePattern=^.
InlinePattern2=^.

[Row2Bg]
