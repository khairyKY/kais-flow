[TodayLabel]
Meter=String
MeterStyle=sText
X=16
StringAlign=LeftCenter
FontSize=9.4
InlineSetting=Weight | 700
InlinePattern=^\D+
InlineSetting2=Color | #KfMuted#
InlinePattern2=\d+$
Text=

; ---------------------------------------------------------------- footer: overdue, what didn't fit, and +

[TodayFoot]
Meter=String
MeterStyle=sText
X=16
Y=331
W=290
ClipString=1
StringAlign=LeftCenter
FontSize=9
FontColor=#KfMuted#
InlineSetting=Color | #KfOver#
InlinePattern=^Overdue \d+
Text=

[TodayAdd]
Meter=Shape
MeterStyle=sShape
X=318
Y=318
Shape=Ellipse 13,13,13 | StrokeWidth 0 | Fill Color #KfTerra#
LeftMouseUpAction=["#AppURL#"]
MouseActionCursor=1

[TodayAddText]
Meter=String
MeterStyle=sText
X=331
Y=330
StringAlign=CenterCenter
FontSize=12.75
FontColor=#KfOnTerra#
Text=+

@Include6=#@#KaisFlow\Top.inc
