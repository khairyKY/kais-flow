[Row4Num]
Meter=String
MeterStyle=sRowNum

[Row4Cb]
Meter=Shape
MeterStyle=sRowCb

[Row4Title]
Meter=String
MeterStyle=sRowTitle

[Row4Meta]
Meter=String
MeterStyle=sRowMeta
