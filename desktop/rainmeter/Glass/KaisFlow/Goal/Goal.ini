[Rainmeter]
Update=1000
AccurateText=1
Group=Glass | KaisFlow
LocalFont1=#@#Fonts\SF Pro Display.OTF
LocalFont2=#@#Fonts\SFPRODISPLAYBOLD.OTF
LocalFont3=#@#Fonts\SFPRODISPLAYMEDIUM.OTF
LocalFont4=#@#Fonts\SourceSerif4-var.ttf
LocalFont5=#@#KaisFlow\Fonts\CourierPrime-Regular.ttf
ContextTitle=Open Kai's Flow
ContextAction=["#AppURL#"]
ContextTitle2=Add or change my Widget link
ContextAction2=[!CommandMeasure MeasureInput "ExecuteBatch 1"]
ContextTitle3=Rebuild glass (after changing wallpaper)
ContextAction3=["powershell" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "#@#make-backdrop.ps1"]

[Metadata]
Name=Kai's Flow - Goal
Author=Kai
Information=Small (1x1): the goal of the day, tickable. Its cherry opens into bloom when it's done. Paper on glass (design-export/Desktop widgets.html, direction B). Data: the Widget link from Kai's Flow (Settings > App & updates > Windows desktop), pasted with "Add my link". Snaps to the Glass grid.
Version=1.0

[Variables]
Widget=Goal
W=170
H=170
Radius=24
PlantX=114
PlantY=-30
; where it first appears (then it stays where you drag it)
DefaultX=20
DefaultY=780
@Include=#@#GlassVars.inc
@Include2=#@#KaisFlow\KaisFlow.inc

@Include3=#@#Snap.inc
@Include4=#@#GlassCard.inc
@Include5=#@#KaisFlow\Paper.inc

[GoalCard]
Meter=Shape
MeterStyle=sShape
X=14
Y=22
MouseOverAction=[!CommandMeasure MeasureKF "Over('#CURRENTSECTION#')"]
MouseLeaveAction=[!CommandMeasure MeasureKF "Out('#CURRENTSECTION#')"]
LeftMouseUpAction=["#AppURL#"]
MouseActionCursor=1

[GoalTape]
Meter=Image
ImageName=#@#KaisFlow\tape.png
X=60
Y=14
Group=Content

[GoalStamp]
Meter=String
MeterStyle=sText
X=26
Y=34
W=118
ClipString=1
FontFace=#Mono#
FontSize=7.1
FontColor=#KfGold#
InlineSetting=CharacterSpacing | 0 | 1 | 0
Text=

[GoalTitle]
Meter=String
MeterStyle=sText
X=26
Y=52
W=118
H=74
ClipString=2
FontFace=#Serif#
FontWeight=600
FontSize=11.6
Text=

[GoalCb]
Meter=Shape
MeterStyle=sRowCb
X=26
Y=127
Hidden=0

[GoalWhen]
Meter=String
MeterStyle=sText
X=51
Y=135
W=93
ClipString=1
StringAlign=LeftCenter
FontSize=9
FontColor=#KfMuted#
Text=

@Include6=#@#KaisFlow\Top.inc
