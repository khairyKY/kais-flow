[Rainmeter]
Update=1000
AccurateText=1
Group=Glass | KaisFlow
LocalFont1=#@#Fonts\SF Pro Display.OTF
LocalFont2=#@#Fonts\SFPRODISPLAYBOLD.OTF
LocalFont3=#@#Fonts\SFPRODISPLAYMEDIUM.OTF
LocalFont4=#@#Fonts\SourceSerif4-var.ttf
LocalFont5=#@#KaisFlow\Fonts\CourierPrime-Regular.ttf
ContextTitle=Open Kai's Flow
ContextAction=["#AppURL#"]
ContextTitle2=Add or change my Widget link
ContextAction2=[!CommandMeasure MeasureInput "ExecuteBatch 1"]
ContextTitle3=Rebuild glass (after changing wallpaper)
ContextAction3=["powershell" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "#@#make-backdrop.ps1"]

[Metadata]
Name=Kai's Flow - Next
Author=Kai
Information=Small (1x1): the next block, when it starts, and the one after. Paper on glass (design-export/Desktop widgets.html, direction B). Data: the Widget link from Kai's Flow (Settings > App & updates > Windows desktop), pasted with "Add my link". Snaps to the Glass grid.
Version=1.0

[Variables]
Widget=Next
W=170
H=170
Radius=24
PlantX=114
PlantY=-30
; where it first appears (then it stays where you drag it)
DefaultX=210
DefaultY=780
@Include=#@#GlassVars.inc
@Include2=#@#KaisFlow\KaisFlow.inc

@Include3=#@#Snap.inc
@Include4=#@#GlassCard.inc
@Include5=#@#KaisFlow\Paper.inc

[SNHead]
Meter=String
MeterStyle=sText
X=14
Y=24
StringAlign=LeftCenter
FontSize=9.75
FontColor=#KfMuted#
InlineSetting=Weight | 700
InlinePattern=^\S+
InlineSetting2=Color | #KfInk#
InlinePattern2=^\S+
Text=

; the block's colour as a bar down the title's left edge (widget.lua sizes it to the title)
[SNBar]
Meter=Shape
MeterStyle=sShape
X=14
Y=42

[SNTitle]
Meter=String
MeterStyle=sText
X=25
Y=42
W=131
ClipString=2
ClipStringH=56
FontWeight=700
FontSize=11.6
Text=

[SNWhen]
Meter=String
MeterStyle=sText
X=14
Y=65
FontSize=9
FontColor=#KfMuted#
Text=

[SNThen]
Meter=String
MeterStyle=sText
X=14
Y=148
W=142
ClipString=1
StringAlign=LeftCenter
FontSize=9
FontColor=#KfMuted#
Text=

@Include6=#@#KaisFlow\Top.inc
