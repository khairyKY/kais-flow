[Rainmeter]
Update=1000
AccurateText=1
Group=Glass | KaisFlow
LocalFont1=#@#Fonts\SF Pro Display.OTF
LocalFont2=#@#Fonts\SFPRODISPLAYBOLD.OTF
LocalFont3=#@#Fonts\SFPRODISPLAYMEDIUM.OTF
LocalFont4=#@#Fonts\SourceSerif4-var.ttf
LocalFont5=#@#KaisFlow\Fonts\CourierPrime-Regular.ttf
ContextTitle=Open Kai's Flow
ContextAction=[!CommandMeasure MeasureKF "Go('today')"]
ContextTitle2=Add or change my Widget link
ContextAction2=[!CommandMeasure MeasureInput "ExecuteBatch 1"]
ContextTitle3=-
ContextTitle4=Theme: Auto (7 PM - 6 AM)
ContextAction4=[!CommandMeasure MeasureKF "SetTheme('auto')"]
ContextTitle5=Theme: Day
ContextAction5=[!CommandMeasure MeasureKF "SetTheme('day')"]
ContextTitle6=Theme: Night
ContextAction6=[!CommandMeasure MeasureKF "SetTheme('night')"]
ContextTitle7=-
ContextTitle8=Rebuild glass (new wallpaper)
ContextAction8=["powershell" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "#@#make-backdrop.ps1"]

[Metadata]
Name=Kai's Flow - Now + next
Author=Kai
Information=Medium (2x1): the block running now, how far in it you are, and the next two. Right-click > Theme: Auto, Day or Night. A click opens the desktop app, or the website when it isn't installed. Paper on glass (design-export/Desktop widgets.html, direction B). Data: the Widget link from Kai's Flow (Settings > App & updates > Windows desktop), pasted with "Add my link". Snaps to the Glass grid.
Version=1.1

[Variables]
Widget=NowNext
W=360
H=170
Radius=24
; where it first appears (then it stays where you drag it)
DefaultX=20
DefaultY=400
@Include=#@#GlassVars.inc
@Include2=#@#KaisFlow\KaisFlow.inc

@Include3=#@#Snap.inc
@Include4=#@#GlassCard.inc
@Include5=#@#KaisFlow\Paper.inc

[KFIcon]
Meter=Shape
X=328
Y=18
Group=Content
DynamicVariables=1
Shape=Ellipse 8,8,5.33 | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round
Shape2=Path Hand | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round
Hand=8,5.2 | LineTo 8,8 | LineTo 10,9.33

[NNHit]
Meter=Shape
MeterStyle=sShape
X=10
Y=44
Shape=Rectangle 0,0,340,32,10 | StrokeWidth 0 | Fill Color 0,0,0,1
LeftMouseUpAction=[!CommandMeasure MeasureKF "Go('now')"]
MouseActionCursor=1

[NNHead]
Meter=String
MeterStyle=sText
X=16
Y=26
StringAlign=LeftCenter
FontSize=9.75
FontColor=#KfMuted#
InlineSetting=Weight | 700
InlinePattern=^\S+
InlineSetting2=Color | #KfInk#
InlinePattern2=^\S+
Text=

[NNLeft]
Meter=String
MeterStyle=sText
X=298
Y=26
StringAlign=RightCenter
FontSize=9.75
FontColor=#KfMuted#
Text=

[NNRing]
Meter=Shape
MeterStyle=sShape
X=16
Y=46

[NNTitle]
Meter=String
MeterStyle=sText
X=36
Y=52
W=308
H=24
ClipString=1
StringAlign=LeftCenter
FontWeight=700
FontSize=12.4
Text=

[NNProg]
Meter=Shape
MeterStyle=sShape
X=16
Y=72

; the next two blocks, in their palette C colours
[Blk1Box]
Meter=Shape
MeterStyle=sShape
X=15
Y=88
LeftMouseUpAction=[!CommandMeasure MeasureKF "Go('next1')"]
MouseActionCursor=1

[Blk1Text]
Meter=String
MeterStyle=sBlkText
Y=102

[Blk1Right]
Meter=String
MeterStyle=sBlkRight
Y=102

[Blk2Box]
Meter=Shape
MeterStyle=sShape
X=15
Y=122
LeftMouseUpAction=[!CommandMeasure MeasureKF "Go('next2')"]
MouseActionCursor=1

[Blk2Text]
Meter=String
MeterStyle=sBlkText
Y=136

[Blk2Right]
Meter=String
MeterStyle=sBlkRight
Y=136

@Include6=#@#KaisFlow\Top.inc
