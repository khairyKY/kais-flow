[Rainmeter]
Update=1000
AccurateText=1
Group=Glass | KaisFlow
LocalFont1=#@#Fonts\SF Pro Display.OTF
LocalFont2=#@#Fonts\SFPRODISPLAYBOLD.OTF
LocalFont3=#@#Fonts\SFPRODISPLAYMEDIUM.OTF
LocalFont4=#@#Fonts\SourceSerif4-var.ttf
LocalFont5=#@#KaisFlow\Fonts\CourierPrime-Regular.ttf
ContextTitle=Open Kai's Flow
ContextAction=[!CommandMeasure MeasureKF "Go('today')"]
ContextTitle2=Add or change my Widget link
ContextAction2=[!CommandMeasure MeasureInput "ExecuteBatch 1"]
ContextTitle3=-
ContextTitle4=Theme: Auto (7 PM - 6 AM)
ContextAction4=[!CommandMeasure MeasureKF "SetTheme('auto')"]
ContextTitle5=Theme: Day
ContextAction5=[!CommandMeasure MeasureKF "SetTheme('day')"]
ContextTitle6=Theme: Night
ContextAction6=[!CommandMeasure MeasureKF "SetTheme('night')"]
ContextTitle7=-
ContextTitle8=Rebuild glass (new wallpaper)
ContextAction8=["powershell" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "#@#make-backdrop.ps1"]

[Metadata]
Name=Kai's Flow - Day bar
Author=Kai
Information=Medium (2x1): today's blocks on one bar from 7am to 11pm, where you are on it, and what's next. Right-click > Theme: Auto, Day or Night. A click opens the desktop app, or the website when it isn't installed. Paper on glass (design-export/Desktop widgets.html, direction B). Data: the Widget link from Kai's Flow (Settings > App & updates > Windows desktop), pasted with "Add my link". Snaps to the Glass grid.
Version=1.1

[Variables]
Widget=DayBar
W=360
H=170
Radius=24
; where it first appears (then it stays where you drag it)
DefaultX=20
DefaultY=590
@Include=#@#GlassVars.inc
@Include2=#@#KaisFlow\KaisFlow.inc

@Include3=#@#Snap.inc
@Include4=#@#GlassCard.inc
@Include5=#@#KaisFlow\Paper.inc

[KFIcon]
Meter=Shape
X=328
Y=18
Group=Content
DynamicVariables=1
Shape=Rectangle 2.67,3.67,10.67,9.67,1.33 | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round
Shape2=Line 2.67,6.67,13.33,6.67 | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round
Shape3=Line 5.67,2.33,5.67,5 | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round
Shape4=Line 10.33,2.33,10.33,5 | StrokeWidth 1.1 | Stroke Color #KfMuted# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round

[DBHead]
Meter=String
MeterStyle=sText
X=16
Y=26
StringAlign=LeftCenter
FontSize=9.75
FontColor=#KfMuted#
InlineSetting=Weight | 700
InlinePattern=^\S+ \d+
InlineSetting2=Color | #KfInk#
InlinePattern2=^\S+ \d+
Text=

; sunrise and sunset over the bar
[DBSun]
Meter=String
MeterStyle=sText
X=16
Y=46
FontSize=8.25
FontColor=#KfGold#
Text=[\x2600]

[DBMoon]
Meter=String
MeterStyle=sText
X=219
Y=46
FontSize=8.25
FontColor=#KfGold#
Text=[\x263E]

; the track 7am-11pm, its blocks, the goal's gold underline and the now line (widget.lua draws them)
[DBBar]
Meter=Shape
MeterStyle=sShape
X=16
Y=46
LeftMouseUpAction=[!CommandMeasure MeasureKF "Go('calendar')"]
MouseActionCursor=1

[DBH8]
Meter=String
MeterStyle=sText
X=37
Y=80
StringAlign=Center
FontSize=7.9
FontColor=#KfMuted#
Text=8am

[DBH12]
Meter=String
MeterStyle=sText
X=119
Y=80
StringAlign=Center
FontSize=7.9
FontColor=#KfMuted#
Text=12pm

[DBH16]
Meter=String
MeterStyle=sText
X=201
Y=80
StringAlign=Center
FontSize=7.9
FontColor=#KfMuted#
Text=4pm

[DBH20]
Meter=String
MeterStyle=sText
X=283
Y=80
StringAlign=Center
FontSize=7.9
FontColor=#KfMuted#
Text=8pm

[Blk1Box]
Meter=Shape
MeterStyle=sShape
X=15
Y=102
LeftMouseUpAction=[!CommandMeasure MeasureKF "Go('next1')"]
MouseActionCursor=1

[Blk1Text]
Meter=String
MeterStyle=sBlkText
Y=116

[Blk1Right]
Meter=String
MeterStyle=sBlkRight
Y=116

@Include6=#@#KaisFlow\Top.inc
