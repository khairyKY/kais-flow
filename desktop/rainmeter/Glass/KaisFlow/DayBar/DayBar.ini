[Rainmeter]
Update=1000
AccurateText=1
Group=Glass | KaisFlow
LocalFont1=#@#Fonts\SF Pro Display.OTF
LocalFont2=#@#Fonts\SFPRODISPLAYBOLD.OTF
LocalFont3=#@#Fonts\SFPRODISPLAYMEDIUM.OTF
LocalFont4=#@#Fonts\SourceSerif4-var.ttf
LocalFont5=#@#KaisFlow\Fonts\CourierPrime-Regular.ttf
ContextTitle=Open Kai's Flow
ContextAction=["#AppURL#"]
ContextTitle2=Add or change my Widget link
ContextAction2=[!CommandMeasure MeasureInput "ExecuteBatch 1"]
ContextTitle3=Rebuild glass (after changing wallpaper)
ContextAction3=["powershell" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "#@#make-backdrop.ps1"]

[Metadata]
Name=Kai's Flow - Day bar
Author=Kai
Information=Medium (2x1): today's blocks on one bar from 7am to 11pm, where you are on it, and what's next. Paper on glass (design-export/Desktop widgets.html, direction B). Data: the Widget link from Kai's Flow (Settings > App & updates > Windows desktop), pasted with "Add my link". Snaps to the Glass grid.
Version=1.0

[Variables]
Widget=DayBar
W=360
H=170
Radius=24
PlantX=302
PlantY=-32
; where it first appears (then it stays where you drag it)
DefaultX=20
DefaultY=590
@Include=#@#GlassVars.inc
@Include2=#@#KaisFlow\KaisFlow.inc

@Include3=#@#Snap.inc
@Include4=#@#GlassCard.inc
@Include5=#@#KaisFlow\Paper.inc

[DBHead]
Meter=String
MeterStyle=sText
X=16
Y=26
StringAlign=LeftCenter
FontSize=9.75
FontColor=#KfMuted#
InlineSetting=Weight | 700
InlinePattern=^\S+ \d+
InlineSetting2=Color | #KfInk#
InlinePattern2=^\S+ \d+
Text=

; sunrise and sunset over the bar
[DBSun]
Meter=String
MeterStyle=sText
X=16
Y=46
FontSize=8.25
FontColor=#KfGold#
Text=[\x2600]

[DBMoon]
Meter=String
MeterStyle=sText
X=219
Y=46
FontSize=8.25
FontColor=#KfGold#
Text=[\x263E]

; the track 7am-11pm, its blocks, the goal's gold underline and the now line (widget.lua draws them)
[DBBar]
Meter=Shape
MeterStyle=sShape
X=16
Y=46

[DBH8]
Meter=String
MeterStyle=sText
X=37
Y=80
StringAlign=Center
FontSize=7.9
FontColor=#KfMuted#
Text=8am

[DBH12]
Meter=String
MeterStyle=sText
X=119
Y=80
StringAlign=Center
FontSize=7.9
FontColor=#KfMuted#
Text=12pm

[DBH16]
Meter=String
MeterStyle=sText
X=201
Y=80
StringAlign=Center
FontSize=7.9
FontColor=#KfMuted#
Text=4pm

[DBH20]
Meter=String
MeterStyle=sText
X=283
Y=80
StringAlign=Center
FontSize=7.9
FontColor=#KfMuted#
Text=8pm

[Blk1Box]
Meter=Shape
MeterStyle=sShape
X=15
Y=102

[Blk1Text]
Meter=String
MeterStyle=sBlkText
Y=116

[Blk1Right]
Meter=String
MeterStyle=sBlkRight
Y=116

@Include6=#@#KaisFlow\Top.inc
