[Rainmeter]
Update=1000
AccurateText=1
Group=Glass | KaisFlow
LocalFont1=#@#Fonts\SF Pro Display.OTF
LocalFont2=#@#Fonts\SFPRODISPLAYBOLD.OTF
LocalFont3=#@#Fonts\SFPRODISPLAYMEDIUM.OTF
LocalFont4=#@#Fonts\SourceSerif4-var.ttf
LocalFont5=#@#KaisFlow\Fonts\CourierPrime-Regular.ttf
ContextTitle=Open Kai's Flow
ContextAction=[!CommandMeasure MeasureKF "Go('today')"]
ContextTitle2=Add or change her-day key
ContextAction2=[!CommandMeasure MeasureInput "ExecuteBatch 1"]
ContextTitle3=-
ContextTitle4=Theme: Auto (7 PM - 6 AM)
ContextAction4=[!CommandMeasure MeasureKF "SetTheme('auto')"]
ContextTitle5=Theme: Day
ContextAction5=[!CommandMeasure MeasureKF "SetTheme('day')"]
ContextTitle6=Theme: Night
ContextAction6=[!CommandMeasure MeasureKF "SetTheme('night')"]
ContextTitle7=-
ContextTitle8=Rebuild glass (new wallpaper)
ContextAction8=["powershell" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "#@#make-backdrop.ps1"]

[Metadata]
Name=Kai's Flow - Her day
Author=Kai
Information=Medium (2x1): the person you share with, her block now and next, and at Details her goal and Top 3. Asks every 5 minutes with a key of its own (Kai's Flow, Settings > Sharing > Widgets > Make a key), pasted with "Add her-day key". It shows only what she allows, never your own day. After 24 hours without an answer it greys out and hides titles; a stopped key or a disconnect clears it. Right-click > Theme: Auto, Day or Night. A click opens the desktop app, or the website when it isn't installed. Paper on glass (design-export/Desktop widgets.html, direction B). Snaps to the Glass grid.
Version=1.2

[Variables]
Widget=HerDay
W=360
H=170
Radius=24
; where it first appears (then it stays where you drag it)
DefaultX=400
DefaultY=400
@Include=#@#GlassVars.inc
@Include2=#@#KaisFlow\HerDay.inc

@Include3=#@#Snap.inc
@Include4=#@#GlassCard.inc
@Include5=#@#KaisFlow\Paper.inc

; a click anywhere on the card opens her day on Today
[HDHit]
Meter=Shape
MeterStyle=sShape
Shape=Rectangle 0,0,#W#,#H#,#Radius# | StrokeWidth 0 | Fill Color 0,0,0,1
LeftMouseUpAction=[!CommandMeasure MeasureKF "Go('today')"]
MouseActionCursor=1

; her round initial in Heather
[HDAv]
Meter=Shape
MeterStyle=sShape
X=14
Y=12
Shape=Ellipse 11,11,11 | StrokeWidth 0 | Fill Color 137,114,179

[HDAvT]
Meter=String
MeterStyle=sText
X=25
Y=23
StringAlign=CenterCenter
FontWeight=700
FontSize=9
FontColor=#KfOnTerra#
Text=

[HDHead]
Meter=String
MeterStyle=sText
X=44
Y=23
W=230
StringAlign=LeftCenter
ClipString=1
FontSize=9.75
FontColor=#KfMuted#
InlineSetting=Weight | 700
InlinePattern=^\S+
InlineSetting2=Color | #KfInk#
InlinePattern2=^\S+
Text=

[HDRight]
Meter=String
MeterStyle=sText
X=346
Y=23
StringAlign=RightCenter
FontSize=9.4
FontColor=#KfMuted#
Text=

; her block now, and the one after (Heather, dashed edge)
[N1Box]
Meter=Shape
MeterStyle=sShape
X=15
Y=44

[N1Text]
Meter=String
MeterStyle=sText | sBlkText
Y=58
Text=

[N1Right]
Meter=String
MeterStyle=sText | sBlkRight
Y=58
Text=

[N2Box]
Meter=Shape
MeterStyle=sShape
X=15
Y=78

[N2Text]
Meter=String
MeterStyle=sText | sBlkText
Y=92
Text=

[N2Right]
Meter=String
MeterStyle=sText | sBlkRight
Y=92
Text=

; her goal of the day (Details only)
[HDStar]
Meter=String
MeterStyle=sText
X=20
Y=130
StringAlign=LeftCenter
FontColor=#KfGold#
Hidden=1
Text=[\x2736]

[HDGoal]
Meter=String
MeterStyle=sText
X=36
Y=130
W=308
H=20
StringAlign=LeftCenter
ClipString=1
FontSize=9.4
Hidden=1
Text=

[HDFoot]
Meter=String
MeterStyle=sText
X=16
Y=155
W=330
StringAlign=LeftCenter
ClipString=1
FontSize=8.4
FontColor=#KfHair#
Text=

@Include6=#@#KaisFlow\Top.inc
