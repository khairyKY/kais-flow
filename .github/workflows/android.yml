name: Android APK

# M1b (docs/phases/M1-android.md): the real Android app — the same dist/ as the web app inside a
# Capacitor shell around Android's system WebView, built with Gradle on GitHub's runners (the
# Android SDK is preinstalled; nothing on Kai's laptop). The android/ project is generated fresh
# each build (`cap add android`) and app/native/android/ is copied over it. Builds on the mobile
# branches for review; a release (release.yml) gets the APK attached.
on:
  push:
    branches: ['claude/mobile-*', 'claude/native-shell']
    paths: ['app/**', '.github/workflows/android.yml', '.github/scripts/**']
  # The Release pipeline (release.yml) calls this with the version tag; the build is stamped with
  # it and attached to that GitHub Release.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_URL: https://kais-flow.kaidagoat.workers.dev

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to attach the APK to a published Release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Capacitor 8's Android library compiles for Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Supabase public config
        env:
          VARS_URL: ${{ vars.VITE_SUPABASE_URL }}
          VARS_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: python3 ../.github/scripts/supabase-public-config.py

      - name: Build the web app
        run: npm run build

      - name: Generate the Android project
        run: |
          set -euo pipefail
          npx cap add android # creates android/ from capacitor.config.ts, then syncs dist/ + plugins into it
          main=android/app/src/main
          # Our activity (the bar strips take the page's colour), launch theme, clover icons.
          test -f "$main/java/com/kaisflow/garden/MainActivity.java" || { echo "::error::generated MainActivity.java not found"; find "$main/java" -name '*.java'; exit 1; }
          cp native/android/MainActivity.java "$main/java/com/kaisflow/garden/MainActivity.java"
          cp -r native/android/res/. "$main/res/"
          # Voice capture: the WebView asks for the mic through the shell, which needs these declared.
          manifest="$main/AndroidManifest.xml"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' "$manifest"
          grep -q RECORD_AUDIO "$manifest" || { echo "::error::RECORD_AUDIO was not added to the manifest"; exit 1; }
          grep -n 'uses-permission' "$manifest"
          # The share sheet: shared text opens the app (MainActivity.onNewIntent → /share). text/*
          # covers text/plain. Images wait for Paper capture, so no image/* yet.
          sed -i 's#</activity>#    <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="text/*" />\n            </intent-filter>\n\n        &#' "$manifest"
          grep -q 'android.intent.action.SEND' "$manifest" || { echo "::error::the SEND intent filter was not added to the manifest"; exit 1; }
          sed -n '/<activity/,/<\/activity>/p' "$manifest"
          grep -n 'app_name' "$main/res/values/strings.xml"

      # versionCode uses Tauri's formula (major·1000000 + minor·1000 + patch), so a release APK still
      # counts as newer than the Tauri-built ones before it. Branch builds are 0.0.0-dev, code 1.
      - name: Stamp the version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            name="${TAG#v}"
            IFS=. read -r major minor patch <<< "${name%%[-+]*}"
            code=$(( ${major:-0} * 1000000 + ${minor:-0} * 1000 + ${patch:-0} ))
          else
            name="0.0.0-dev.${GITHUB_SHA::7}"
            code=1
          fi
          gradle=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $code/; s/versionName \"[^\"]*\"/versionName \"$name\"/" "$gradle"
          grep -nE 'namespace|applicationId|versionCode|versionName' "$gradle"

      - name: Build
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned="$(find android/app/build/outputs/apk -name '*release*.apk' | head -1)"
          test -n "$unsigned" || { echo "::error::no release APK was produced"; find android/app/build/outputs -type f | head -20; exit 1; }
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; pass="$KEYSTORE_PASSWORD"
            echo "Signing with the project key (in-place updates work)."
          else
            pass="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias kaisflow -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$pass" -keypass "$pass" -dname "CN=Kai's Flow" > /dev/null 2>&1
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: signed with a one-off key. Installing a later build over this one needs an uninstall first."
          fi
          tag='${{ inputs.tag }}'
          name="kais-flow-${tag:-${GITHUB_SHA::7}}.apk"
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$pass" --out "$RUNNER_TEMP/$name" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "$RUNNER_TEMP/$name" | head -3
          echo "APK=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"
          echo "- APK: \`$name\` ($(du -h "$RUNNER_TEMP/$name" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK }}
          retention-days: 30

      - name: Attach to the Release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "$APK" --clobber

  smoke:
    name: Emulator smoke test
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          path: apk
          merge-multiple: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The APK carries no native code, so the x86_64 emulator runs the exact file a phone gets.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh
      # Artifacts aren't reachable from the conductor's sandbox, so the screens also go to the log
      # as small base64 JPEGs between markers (plus the UI tree and the WebView's console).
      - name: Screens to the log
        if: always()
        run: |
          sudo apt-get install -y -qq python3-pil > /dev/null
          python3 - <<'PY'
          import base64, glob, io
          from PIL import Image
          for p in sorted(glob.glob('shots/*.png')):
              im = Image.open(p).convert('RGB')
              full = im.size
              im.thumbnail((432, 960))
              buf = io.BytesIO(); im.save(buf, 'JPEG', quality=72)
              b = base64.b64encode(buf.getvalue()).decode()
              print(f'=====BEGIN {p} full={full} small={im.size}=====')
              for i in range(0, len(b), 160):
                  print(b[i:i + 160])
              print(f'=====END {p}=====')
          PY
          cat shots/webview-top.txt || true
          cat shots/back.txt || true
          echo '----- activity lifecycle'; cat shots/lifecycle.txt || true
          echo '----- second cold start'; cat shots/lifecycle-2nd.txt || true
          echo '----- window insets'; cat shots/window.txt || true
          echo '----- share sheet'; cat shots/share-targets.txt shots/share.txt || true
          echo '----- ui tree (text + bounds)'; grep -o 'text="[^"]*"[^>]*bounds="[^"]*"' shots/ui.xml | head -60 || true
          echo '----- logcat (webview / console)'; tail -80 shots/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screens
          path: shots
          retention-days: 14
