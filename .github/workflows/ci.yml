name: CI

# The automated half of the release gate: the suite under four timezones + a production build.
# Runs on the integration branches, on PRs, and as the first job of Release.
on:
  push:
    branches: [master, 'claude/release-*']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Africa/Cairo, America/Los_Angeles, Asia/Tokyo]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx vitest run
        env:
          TZ: ${{ matrix.tz }}

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
