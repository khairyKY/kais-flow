name: Rehearsal

# Migrations and edge functions against real Supabase Postgres before production sees them. The
# 2026-09-26 release found production's 0014/0020/0022 differed from the files and stopped mid-way
# at 0034 (docs/HANDOFF.md §3.2, §8).
#   Fresh chain (no secrets): a local stack applies every migration 0001→latest from scratch, the
#     harness suites (supabase/tests) run against it, and every function entry is type-checked.
#   Production rehearsal (owner only): production's schema — no data — is restored into a second
#     fresh local stack together with production's migration history, then ONLY the pending files
#     are applied, the way `db push --include-all` would. Toward production it only reads: link, a
#     schema-only dump, one SELECT. The dump never leaves the runner (the repo is public).
# release.yml calls this before its db push, so a release can't push migrations that didn't rehearse.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: false
  push:
    branches: ['claude/release-*']

permissions:
  contents: read

env:
  PROJECT_REF: eqbbkitofgyxxrfggpbu
  # Same CLI as release.yml, so migrations apply here exactly as the release will apply them.
  SUPABASE_CLI: 2.118.0
  # The local-stack recipe (docs/log/2026-09-26-0450-bohr-decision-local-stack.md).
  EXCLUDE: studio,imgproxy,logflare,vector,supavisor

jobs:
  fresh:
    name: Fresh chain
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      SUPABASE: supabase # the suites read the local stack with `${SUPABASE:-npx supabase} status`
      DENO_NO_UPDATE_CHECK: 1
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Type-check every function (deno check)
        run: |
          echo "### Functions" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for f in supabase/functions/*/index.ts; do
            fn=$(basename "$(dirname "$f")")
            if deno check --quiet --no-lock "$f" > "$RUNNER_TEMP/check-$fn.log" 2>&1; then
              echo "- \`deno check\` $fn ✓" >> "$GITHUB_STEP_SUMMARY"
            else
              fail=1
              echo "::group::deno check $fn" && cat "$RUNNER_TEMP/check-$fn.log" && echo "::endgroup::"
              echo "- \`deno check\` $fn ✗ $(grep -m1 -E '^(TS[0-9]+|error)' "$RUNNER_TEMP/check-$fn.log" | sed 's/\x1b\[[0-9;]*m//g')" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit $fail

      # config.toml carries production's email setup: Gmail SMTP from env secrets + Confirm email on.
      # The runner has neither secret, so a local sign-up would wait on a mail that never goes out.
      # This edits the runner's copy only; the suites' test accounts then sign up and in directly.
      - name: Local auth without email
        if: ${{ !cancelled() }}
        run: |
          sed -i -e '/^\[auth\.email\]/,/^\[/ s/^enable_confirmations = true/enable_confirmations = false/' \
                 -e '/^\[auth\.email\.smtp\]/,/^\[/ s/^enabled = true/enabled = false/' supabase/config.toml
          python3 -c 'import tomllib; e = tomllib.load(open("supabase/config.toml", "rb"))["auth"]["email"]; assert not e["enable_confirmations"] and not e["smtp"]["enabled"]'

      - name: Local stack — every migration from scratch
        id: start
        if: ${{ !cancelled() }}
        run: |
          echo "### Migrations from scratch" >> "$GITHUB_STEP_SUMMARY"
          if ! supabase start -x "$EXCLUDE"; then
            echo "- ✗ \`supabase start\` failed — the failing migration and statement are in the step log" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
          # The migrations schedule cron jobs that POST to production's functions; not from a runner.
          psql "$DB_URL" -X -q -o /dev/null -c "select cron.alter_job(jobid, active := false) from cron.job"
          applied=$(psql "$DB_URL" -X -At -c "select string_agg(version, ' ' order by version) from supabase_migrations.schema_migrations")
          echo "- $(wc -w <<< "$applied") of $(ls supabase/migrations/*.sql | wc -l) files applied ✓ — $applied" >> "$GITHUB_STEP_SUMMARY"

      - name: fix0-auth.sh --harness (auth gates, per-user notify, resurface, search scoping, CORS)
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: bash supabase/tests/fix0-auth.sh --harness 2>&1 | tee "$RUNNER_TEMP/suite-fix0-auth.log"
      - name: sec2.sh (AI allowance, anonymous users, push hosts, slipping)
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: bash supabase/tests/sec2.sh 2>&1 | tee "$RUNNER_TEMP/suite-sec2.log"
      - name: notify-prune.sh (dead push devices, and only them)
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: bash supabase/tests/notify-prune.sh 2>&1 | tee "$RUNNER_TEMP/suite-notify-prune.log"
      - name: mcp-week.sh (MCP write tools against Postgres, RLS per key)
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: bash supabase/tests/mcp-week.sh 2>&1 | tee "$RUNNER_TEMP/suite-mcp-week.log"
      - name: mcp-full.sh (every MCP tool against Postgres, the journal / people scope gate)
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: bash supabase/tests/mcp-full.sh 2>&1 | tee "$RUNNER_TEMP/suite-mcp-full.log"
      - name: fix5-search.sh (search_hybrid ranking + isolation)
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: bash supabase/tests/fix5-search.sh 2>&1 | tee "$RUNNER_TEMP/suite-fix5-search.log"
      - name: retainer-reload.sql (monthly retainer reload)
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/retainer-reload.sql 2>&1 | tee "$RUNNER_TEMP/suite-retainer-reload.log"

      - name: Summary
        if: always()
        run: |
          echo "### Suites" >> "$GITHUB_STEP_SUMMARY"
          for s in fix0-auth sec2 notify-prune mcp-week mcp-full fix5-search retainer-reload; do
            log="$RUNNER_TEMP/suite-$s.log"
            if [ ! -f "$log" ]; then echo "- $s: did not run"; continue; fi
            result=$(grep -oE '^[0-9]+ passed.*|retainer-reload: all checks passed' "$log" | tail -1 || true)
            echo "- $s: ${result:-no result line — see the step log}"
            grep -E '^  FAIL ' "$log" | head -30 | sed 's/^  FAIL /    - FAIL /' || true
          done >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production rehearsal
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Token present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI }}

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"

      # Versions and names only. Pending = files production hasn't recorded.
      - name: Production's migration history (one read-only SELECT)
        run: |
          curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            -d '{"query":"select version, name from supabase_migrations.schema_migrations order by version","read_only":true}' \
            > "$RUNNER_TEMP/applied.json"
          jq -r '.[].version' "$RUNNER_TEMP/applied.json" | sort > "$RUNNER_TEMP/applied.txt"
          ls supabase/migrations/*.sql | sed 's#.*/##; s/_.*//' | sort > "$RUNNER_TEMP/files.txt"
          pending=$(comm -13 "$RUNNER_TEMP/applied.txt" "$RUNNER_TEMP/files.txt" | tr '\n' ' ')
          unknown=$(comm -23 "$RUNNER_TEMP/applied.txt" "$RUNNER_TEMP/files.txt" | tr '\n' ' ')
          echo "PENDING=$pending" >> "$GITHUB_ENV"
          {
            echo "### Production rehearsal"
            echo "- Production has $(wc -l < "$RUNNER_TEMP/applied.txt") migrations recorded, latest \`$(tail -1 "$RUNNER_TEMP/applied.txt")\`"
            echo "- Pending: ${pending:-none}"
            [ -z "$unknown" ] || echo "- ⚠ Recorded in production but no file here: $unknown (db push refuses this too)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump production's schema (no data; stays on this runner)
        run: |
          supabase db dump --linked -f "$RUNNER_TEMP/prod-schema.sql"
          if grep -qE '^(COPY|INSERT INTO) ' "$RUNNER_TEMP/prod-schema.sql"; then
            rm -f "$RUNNER_TEMP/prod-schema.sql"
            echo "::error::The schema dump holds data rows; stopping without using it."
            exit 1
          fi
          echo "- Schema dumped: $(wc -l < "$RUNNER_TEMP/prod-schema.sql") lines, no data, not uploaded" >> "$GITHUB_STEP_SUMMARY"

      - name: Fresh local stack with no migrations
        run: |
          mv supabase/migrations "$RUNNER_TEMP/migrations" && mkdir supabase/migrations
          supabase start -x "$EXCLUDE"
          rmdir supabase/migrations && mv "$RUNNER_TEMP/migrations" supabase/migrations
          echo "DB_URL=$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"

      - name: Restore production's schema + migration history into it
        run: |
          # As postgres, pg_dump's GRANTs on the vector extension's functions only warn ("no privileges
          # were granted", ~500 lines); those are dropped. Errors still stop the restore.
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/prod-schema.sql" 2>&1 > /dev/null \
            | { grep -v 'WARNING:  no privileges were granted for' || true; }
          rm -f "$RUNNER_TEMP/prod-schema.sql"
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -c "create schema if not exists supabase_migrations" \
            -c "create table if not exists supabase_migrations.schema_migrations (version text primary key, statements text[], name text)"
          jq -r '.[] | [.version, (.name // "")] | @tsv' "$RUNNER_TEMP/applied.json" \
            | psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -c '\copy supabase_migrations.schema_migrations (version, name) from pstdin'
          echo "- Restored into a fresh local stack: $(psql "$DB_URL" -X -At -c "select count(*) from pg_tables where schemaname = 'public'") public tables, $(psql "$DB_URL" -X -At -c 'select count(*) from supabase_migrations.schema_migrations') migrations recorded" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply only the pending migrations (db push --include-all, on the copy)
        run: |
          set +e
          supabase migration up --local --include-all 2>&1 | tee "$RUNNER_TEMP/up.log"
          rc=${PIPESTATUS[0]}
          set -e
          now=$(psql "$DB_URL" -X -At -c "select version from supabase_migrations.schema_migrations")
          failed=""
          for v in $PENDING; do
            if grep -qx "$v" <<< "$now"; then echo "- \`$v\` ✓"
            elif [ -z "$failed" ]; then failed=$v; echo "- \`$v\` ✗ $(grep -m1 -E 'ERROR|error' "$RUNNER_TEMP/up.log")"
            else echo "- \`$v\` not reached"; fi
          done >> "$GITHUB_STEP_SUMMARY"
          [ -n "$PENDING" ] || echo "- Nothing pending: production = the files" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
