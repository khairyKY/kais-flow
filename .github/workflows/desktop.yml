name: Desktop apps

# M1 step 5 (design-integration/PLAN.md SHIP P2.3): the same Tauri shell as the Android app, built
# as a real Windows installer on GitHub's Windows runner (system WebView2, ~5 MB, no Electron).
# Builds on the mobile branches for review; a release (release.yml) gets the installer attached.
# 2026-10-29: and the Mac app (the macos job below), on a release or a manual run only.
on:
  push:
    branches: ['claude/mobile-*']
    paths: ['app/**', '.github/workflows/desktop.yml', '.github/scripts/**']
  # The Release pipeline (release.yml) calls this with the version tag; the build is stamped with
  # it and attached to that GitHub Release.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_URL: https://kais-flow.kaidagoat.workers.dev

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write # only used to attach the installer to a published Release
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: npm ci

      - name: Stamp the release version
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version=process.env.TAG.replace(/^v/,'');require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Supabase public config
        env:
          VARS_URL: ${{ vars.VITE_SUPABASE_URL }}
          VARS_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: python ../.github/scripts/supabase-public-config.py

      # Updates install in place (lib/appUpdate.ts installUpdate, docs/MICROSOFT-STORE.md "Updates"):
      # Tauri's updater only runs an installer signed with this key (minisign, free; the private half
      # lives only in Kai's local signing folder and these two secrets). Without them (a fork) the
      # installer builds as before, with no .sig and no latest.json.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles nsis
          else
            echo "::notice title=No updater signature::TAURI_SIGNING_PRIVATE_KEY isn't set, so this installer can't update the app in place."
            npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Collect
        run: |
          set -euo pipefail
          exe="$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)"
          tag='${{ inputs.tag }}'
          name="kais-flow-${tag:-${GITHUB_SHA::7}}-windows-setup.exe"
          cp "$exe" "$RUNNER_TEMP/$name"
          # The signature is over the file's bytes, so it holds for the renamed copy too.
          if [ -f "$exe.sig" ]; then cp "$exe.sig" "$RUNNER_TEMP/$name.sig"; fi
          echo "EXE=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
          echo "EXE_NAME=$name" >> "$GITHUB_ENV"
          echo "- Windows installer: \`$name\` ($(du -h "$RUNNER_TEMP/$name" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}
          path: ${{ env.EXE }}
          retention-days: 30

      # The app itself (not its installer), for the msix job below: the Store package is this same build.
      - uses: actions/upload-artifact@v4
        if: vars.STORE_IDENTITY_NAME != ''
        with:
          name: kais-flow-app-exe
          path: app/src-tauri/target/release/kais-flow.exe
          retention-days: 1

      - name: Attach to the Release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ inputs.tag }}
        # A version-less copy beside the versioned file, so releases/latest/download/kais-flow-windows-setup.exe
        # always serves the newest one (the web app's download bar, Settings → App, docs/INSTALL.md).
        # The versioned file stays: the apps' update check and the site read it. With a signature, also
        # latest.json (releases/latest/download/latest.json, tauri.conf.json plugins.updater): the
        # versioned file's URL in the releases repo and its signature, which the Windows app updates in
        # place from, merged into any latest.json the release has (a Mac build that finished first).
        # Every repo in releases.sh gets the same files.
        run: |
          set -euo pipefail
          . ../.github/scripts/releases.sh
          cp "$EXE" "$RUNNER_TEMP/kais-flow-windows-setup.exe"
          files=("$EXE" "$RUNNER_TEMP/kais-flow-windows-setup.exe")
          if [ -f "$EXE.sig" ]; then
            rgh "$PRIMARY_REPO" release download "$TAG" -p latest.json -O "$RUNNER_TEMP/base.json" 2>/dev/null || true
            NOTES="$(rgh "$PRIMARY_REPO" release view "$TAG" --json body -q .body || true)" \
              node ../.github/scripts/latest-json.mjs "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/latest.json" \
              windows-x86_64 "$EXE.sig" "https://github.com/$PRIMARY_REPO/releases/download/$TAG/$EXE_NAME"
            files+=("$EXE.sig" "$RUNNER_TEMP/latest.json")
          else
            echo "::warning::No updater signature, so no latest.json: Windows apps update through the browser download this time."
          fi
          release_upload "${files[@]}"

  # The Microsoft Store package (docs/MICROSOFT-STORE.md): the build above as an UNSIGNED MSIX, which
  # Kai uploads in Partner Center; the Store signs what it ships, so no certificate is needed ($0).
  # Its identity is Partner Center's (Product management → Product identity), kept in three repo
  # VARIABLES: not secrets, every Store app's manifest shows them. Without them the job doesn't start
  # (2026-10-29: a Windows runner billed ×2 just to say "skipped" each release).
  msix:
    name: Microsoft Store package
    needs: windows
    if: vars.STORE_IDENTITY_NAME != ''
    runs-on: windows-latest
    permissions:
      contents: write # only used to attach the package to a published Release
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app/src-tauri
            .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: kais-flow-app-exe
          path: exe

      - name: Pack (makeappx)
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not ($env:STORE_IDENTITY_NAME -and $env:STORE_PUBLISHER -and $env:STORE_PUBLISHER_DISPLAY_NAME)) {
            echo "::notice title=No Microsoft Store package::Set the STORE_IDENTITY_NAME, STORE_PUBLISHER and STORE_PUBLISHER_DISPLAY_NAME repo variables (docs/MICROSOFT-STORE.md); the next build then makes the .msix."
            echo "- Microsoft Store package: skipped, the STORE_* repo variables aren't set yet (docs/MICROSOFT-STORE.md)" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          # The Store's version is x.y.z.0: the tag's (v1.2.3 → 1.2.3.0), else this build's tauri.conf.json.
          $v = if ($env:TAG) { $env:TAG -replace '^v' -replace '-.*$' } else { (Get-Content -Raw app/src-tauri/tauri.conf.json | ConvertFrom-Json).version }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "'$v' is not x.y.z, which the Store's version needs" }
          $label = if ($env:TAG) { $env:TAG } else { $env:GITHUB_SHA.Substring(0, 7) }
          $out = "$env:RUNNER_TEMP\kais-flow-$label.msix"

          New-Item -ItemType Directory -Force layout/Assets | Out-Null
          Copy-Item exe/kais-flow.exe layout/
          foreach ($logo in 'StoreLogo', 'Square44x44Logo', 'Square71x71Logo', 'Square150x150Logo') { Copy-Item "app/src-tauri/icons/$logo.png" layout/Assets/ }
          $x = [System.Security.SecurityElement]
          (Get-Content -Raw app/src-tauri/msix/AppxManifest.xml).
            Replace('{{NAME}}', $x::Escape($env:STORE_IDENTITY_NAME)).
            Replace('{{PUBLISHER}}', $x::Escape($env:STORE_PUBLISHER)).
            Replace('{{PUBLISHER_DISPLAY_NAME}}', $x::Escape($env:STORE_PUBLISHER_DISPLAY_NAME)).
            Replace('{{VERSION}}', "$v.0") | Set-Content -Encoding utf8 layout/AppxManifest.xml

          # The newest Windows SDK on the runner. pack checks the manifest against the schema; unpack
          # proves the file is a whole package.
          $makeappx = (Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/10.*/x64/makeappx.exe' | Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1).FullName
          & $makeappx pack /d layout /p $out /o
          if ($LASTEXITCODE) { throw "makeappx pack failed ($LASTEXITCODE)" }
          & $makeappx unpack /p $out /d unpacked /o
          if ($LASTEXITCODE) { throw "makeappx unpack failed ($LASTEXITCODE)" }
          $id = ([xml](Get-Content -Raw unpacked/AppxManifest.xml)).Package.Identity
          echo "MSIX=$out" >> $env:GITHUB_OUTPUT
          echo "- Microsoft Store package: ``$(Split-Path $out -Leaf)`` ($([math]::Round((Get-Item $out).Length / 1MB, 1)) MB) · $($id.Name) $($id.Version) · unsigned, for Partner Center" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: steps.pack.outputs.MSIX
        with:
          name: kais-flow-msix
          path: ${{ steps.pack.outputs.MSIX }}
          retention-days: 30

      - name: Attach to the Release
        if: steps.pack.outputs.MSIX && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        # Versioned for Partner Center, plus a version-less copy (releases/latest/download/kais-flow.msix),
        # the same pattern as the installer above.
        run: |
          set -euo pipefail
          . .github/scripts/releases.sh
          msix="$(cygpath -u '${{ steps.pack.outputs.MSIX }}')"
          cp "$msix" "$RUNNER_TEMP/kais-flow.msix"
          release_upload "$msix" "$RUNNER_TEMP/kais-flow.msix"

  # The Mac app (docs/log/2026-10-29-*-mac-app-handoff.md): the same Tauri shell, one universal .app
  # (Apple silicon + Intel) in a .dmg. $0: the repo is public, so GitHub's macOS runners are free. No
  # Apple Developer account means no notarization: the app is ad-hoc signed (tauri.conf.json
  # bundle.macOS.signingIdentity "-", without which Apple silicon calls a downloaded copy "damaged"), and
  # the person allows it once (Privacy & Security → Open Anyway, the site's guides/install-mac). Updates
  # use the Windows build's updater key: the updater job below adds the darwin entries to latest.json.
  # Only on a release or a manual run (Actions → Desktop apps → Run workflow), not on the
  # claude/mobile-* pushes that build Windows. The repo variable MAC_BUILD_ON (github, the default, or
  # codemagic) picks who builds it: a private repo's macOS minutes bill ×10, so once private,
  # codemagic.yaml builds the same script on Codemagic's free Mac minutes and this job never starts.
  macos:
    name: Build Mac app
    if: (inputs.tag != '' || github.event_name == 'workflow_dispatch') && vars.MAC_BUILD_ON != 'codemagic'
    runs-on: macos-latest
    permissions:
      contents: write # only used to attach the .dmg to a published Release
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      # Everything Mac lives in the script (build, the checks, the named files), so a Codemagic build
      # can run the same thing once the repo goes private. universal-apple-darwin = both slices in one
      # .app: one .dmg, one updater bundle and signature, which latest.json's darwin-aarch64 and
      # darwin-x86_64 both point at. The checks: the .dmg mounts and holds the .app beside an Applications
      # link; the .app is ad-hoc signed, universal, with this version and identifier; the copy dragged
      # out of the .dmg starts and keeps running 25 s (a crash at launch fails the build).
      - name: Build and check (mac-build.sh)
        working-directory: .
        env:
          TAG: ${{ inputs.tag }}
          OUT: ${{ runner.temp }}/mac
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          .github/scripts/mac-build.sh
          tag='${{ inputs.tag }}'
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "LABEL=${tag:-${GITHUB_SHA::7}}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: kais-flow-mac
          path: ${{ env.OUT }}
          retention-days: 30

      # Versioned, plus a version-less .dmg (releases/latest/download/kais-flow-mac.dmg: the web app's
      # download bar, Settings → App, the site), the same pattern as the Windows installer.
      - name: Attach to the Release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          . ../.github/scripts/releases.sh
          cp "$OUT/kais-flow-$LABEL-mac.dmg" "$RUNNER_TEMP/kais-flow-mac.dmg"
          release_upload "$OUT"/* "$RUNNER_TEMP/kais-flow-mac.dmg"

  # latest.json's darwin entries, once both builds are done: the Windows job writes latest.json, so this
  # waits for it (success or not) and adds to whatever is there (latest-json.mjs), never racing it. A
  # failed Mac build leaves latest.json as Windows wrote it. A manual run (no tag) merges into the newest
  # release's latest.json in the runner only, to prove the Windows entry survives; nothing is uploaded.
  # The URLs point into the releases repo (releases.sh PRIMARY_REPO); every repo gets the same file.
  updater:
    name: Updater manifest (Mac)
    needs: [windows, macos]
    if: always() && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to replace latest.json on a published Release
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: kais-flow-mac
          path: mac

      - name: Add the darwin entries to latest.json
        run: |
          set -euo pipefail
          . .github/scripts/releases.sh
          sig="$(ls mac/*.app.tar.gz.sig 2>/dev/null | head -1 || true)"
          if [ -z "$sig" ]; then
            echo "::warning::No updater signature, so no darwin entries: Mac apps update through the .dmg this time."
            exit 0
          fi
          file="$(basename "${sig%.sig}")"
          if [ -n "$TAG" ]; then
            rgh "$PRIMARY_REPO" release download "$TAG" -p latest.json -O base.json || true
            url="https://github.com/$PRIMARY_REPO/releases/download/$TAG/$file"
          else
            rgh "$PRIMARY_REPO" release download -p latest.json -O base.json || gh release download -R "$GITHUB_REPOSITORY" -p latest.json -O base.json || true
            url="https://github.com/$PRIMARY_REPO/releases/download/manual-run/$file"
          fi
          # The universal .app runs on both, so both keys name the same bundle.
          node .github/scripts/latest-json.mjs base.json latest.json darwin-aarch64 "$sig" "$url" darwin-x86_64 "$sig" "$url"
          if [ -f base.json ]; then
            # Every entry the base had (same version) is still there with its URL, the Windows one above all.
            lost="$(jq -r --slurpfile o latest.json 'select(.version == $o[0].version) | .platforms // {} | to_entries[] | select(.key | startswith("darwin-") | not) | select($o[0].platforms[.key].url != .value.url) | .key' base.json)"
            if [ -n "$lost" ]; then echo "::error::the merge changed $lost"; exit 1; fi
          fi
          if ! jq -e '.platforms["windows-x86_64"]' latest.json > /dev/null; then
            # A manual run proves the Windows entry survives; a release without one (no key, a failed build) only warns.
            if [ -z "$TAG" ]; then echo "::error::no windows-x86_64 entry"; exit 1; fi
            echo "::warning::latest.json has no windows-x86_64 entry (the Windows build had no signature, or failed)"
          fi
          jq '.platforms | map_values(.url)' latest.json
          echo "- Updater: latest.json → $(jq -r '.platforms | keys | join(", ")' latest.json)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$TAG" ]; then
            release_upload latest.json
          fi
