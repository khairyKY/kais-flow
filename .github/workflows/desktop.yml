name: Windows app

# M1 step 5 (design-integration/PLAN.md SHIP P2.3): the same Tauri shell as the Android app, built
# as a real Windows installer on GitHub's Windows runner (system WebView2, ~5 MB, no Electron).
# Builds on the mobile branches for review; a release (release.yml) gets the installer attached.
on:
  push:
    branches: ['claude/mobile-*']
    paths: ['app/**', '.github/workflows/desktop.yml', '.github/scripts/**']
  # The Release pipeline (release.yml) calls this with the version tag; the build is stamped with
  # it and attached to that GitHub Release.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_URL: https://kais-flow.kaidagoat.workers.dev

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write # only used to attach the installer to a published Release
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: npm ci

      - name: Stamp the release version
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version=process.env.TAG.replace(/^v/,'');require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Supabase public config
        env:
          VARS_URL: ${{ vars.VITE_SUPABASE_URL }}
          VARS_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: python ../.github/scripts/supabase-public-config.py

      - name: Build
        run: npx tauri build --bundles nsis

      - name: Collect
        run: |
          set -euo pipefail
          exe="$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)"
          tag='${{ inputs.tag }}'
          name="kais-flow-${tag:-${GITHUB_SHA::7}}-windows-setup.exe"
          cp "$exe" "$RUNNER_TEMP/$name"
          echo "EXE=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
          echo "EXE_NAME=$name" >> "$GITHUB_ENV"
          echo "- Windows installer: \`$name\` ($(du -h "$RUNNER_TEMP/$name" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}
          path: ${{ env.EXE }}
          retention-days: 30

      # The app itself (not its installer), for the msix job below: the Store package is this same build.
      - uses: actions/upload-artifact@v4
        with:
          name: kais-flow-app-exe
          path: app/src-tauri/target/release/kais-flow.exe
          retention-days: 1

      - name: Attach to the Release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "$EXE" --clobber

  # The Microsoft Store package (docs/MICROSOFT-STORE.md): the build above as an UNSIGNED MSIX, which
  # Kai uploads in Partner Center; the Store signs what it ships, so no certificate is needed ($0).
  # Its identity is Partner Center's (Product management → Product identity), kept in three repo
  # VARIABLES: not secrets, every Store app's manifest shows them. Without them this skips, green.
  msix:
    name: Microsoft Store package
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write # only used to attach the package to a published Release
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app/src-tauri

      - uses: actions/download-artifact@v4
        with:
          name: kais-flow-app-exe
          path: exe

      - name: Pack (makeappx)
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not ($env:STORE_IDENTITY_NAME -and $env:STORE_PUBLISHER -and $env:STORE_PUBLISHER_DISPLAY_NAME)) {
            echo "::notice title=No Microsoft Store package::Set the STORE_IDENTITY_NAME, STORE_PUBLISHER and STORE_PUBLISHER_DISPLAY_NAME repo variables (docs/MICROSOFT-STORE.md); the next build then makes the .msix."
            echo "- Microsoft Store package: skipped, the STORE_* repo variables aren't set yet (docs/MICROSOFT-STORE.md)" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          # The Store's version is x.y.z.0: the tag's (v1.2.3 → 1.2.3.0), else this build's tauri.conf.json.
          $v = if ($env:TAG) { $env:TAG -replace '^v' -replace '-.*$' } else { (Get-Content -Raw app/src-tauri/tauri.conf.json | ConvertFrom-Json).version }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "'$v' is not x.y.z, which the Store's version needs" }
          $label = if ($env:TAG) { $env:TAG } else { $env:GITHUB_SHA.Substring(0, 7) }
          $out = "$env:RUNNER_TEMP\kais-flow-$label.msix"

          New-Item -ItemType Directory -Force layout/Assets | Out-Null
          Copy-Item exe/kais-flow.exe layout/
          foreach ($logo in 'StoreLogo', 'Square44x44Logo', 'Square71x71Logo', 'Square150x150Logo') { Copy-Item "app/src-tauri/icons/$logo.png" layout/Assets/ }
          $x = [System.Security.SecurityElement]
          (Get-Content -Raw app/src-tauri/msix/AppxManifest.xml).
            Replace('{{NAME}}', $x::Escape($env:STORE_IDENTITY_NAME)).
            Replace('{{PUBLISHER}}', $x::Escape($env:STORE_PUBLISHER)).
            Replace('{{PUBLISHER_DISPLAY_NAME}}', $x::Escape($env:STORE_PUBLISHER_DISPLAY_NAME)).
            Replace('{{VERSION}}', "$v.0") | Set-Content -Encoding utf8 layout/AppxManifest.xml

          # The newest Windows SDK on the runner. pack checks the manifest against the schema; unpack
          # proves the file is a whole package.
          $makeappx = (Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/10.*/x64/makeappx.exe' | Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1).FullName
          & $makeappx pack /d layout /p $out /o
          if ($LASTEXITCODE) { throw "makeappx pack failed ($LASTEXITCODE)" }
          & $makeappx unpack /p $out /d unpacked /o
          if ($LASTEXITCODE) { throw "makeappx unpack failed ($LASTEXITCODE)" }
          $id = ([xml](Get-Content -Raw unpacked/AppxManifest.xml)).Package.Identity
          echo "MSIX=$out" >> $env:GITHUB_OUTPUT
          echo "- Microsoft Store package: ``$(Split-Path $out -Leaf)`` ($([math]::Round((Get-Item $out).Length / 1MB, 1)) MB) · $($id.Name) $($id.Version) · unsigned, for Partner Center" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: steps.pack.outputs.MSIX
        with:
          name: kais-flow-msix
          path: ${{ steps.pack.outputs.MSIX }}
          retention-days: 30

      - name: Attach to the Release
        if: steps.pack.outputs.MSIX && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$TAG" "$(cygpath -u '${{ steps.pack.outputs.MSIX }}')" --clobber
