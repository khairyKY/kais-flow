name: Release

# One click ships a tested release, in the order docs/DEPLOY-RUNBOOK-v1.md demands:
#   gate → cron-key check → backup → database → edge functions → app (merge into master) → live check
#   → GitHub Release (tag + notes) → Android APK + Windows installer attached to it.
# Nothing touches production until the gate is green and the merge into master is proven to be
# exactly the tested tree. Trigger: push a `v*` tag or a `claude/ship-v*` branch at the release's
# tested commit, publish a GitHub Release targeting it, or (once on master) Actions → Run workflow.
# The repo is public, so this job never prints data or keys; the backup goes to a private
# Storage bucket in the same Supabase project (personal data never leaves Supabase).
on:
  push:
    # A `claude/ship-v*` branch starts a release too: the sandbox's git proxy refuses tag pushes.
    branches: ['claude/ship-v*']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: eqbbkitofgyxxrfggpbu
  APP_URL: https://kais-flow.kaidagoat.workers.dev
  FUNCTIONS: notify embed transcribe parse-capture chat search capture github-connect github-sync capture-image

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: gate
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      label: ${{ steps.ship.outputs.label }}
      sha: ${{ steps.ship.outputs.sha }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      LABEL: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Token present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare the merge into master (pushed last)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RELEASED="$(git rev-parse HEAD)"
          LABEL="${LABEL#claude/ship-}"; echo "LABEL=$LABEL" >> "$GITHUB_ENV"
          git checkout -B master origin/master
          git merge --no-ff --no-edit -m "release $LABEL: merge ${RELEASED:0:7} into master" "$RELEASED"
          if [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse "$RELEASED^{tree}")" ]; then
            echo "::error::master has commits this release doesn't. Merge master into the release branch, let CI pass, then release again."
            exit 1
          fi
          echo "- Release: \`$LABEL\` at \`${RELEASED:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Check the cron key (must be the legacy service_role JWT)
        run: |
          set -euo pipefail
          prefix="$(curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"query\":\"select left(decrypted_secret, 3) as p from vault.decrypted_secrets where name = 'service_role_key'\"}" \
            | jq -r '.[0].p // empty')"
          if [ "$prefix" != "eyJ" ]; then
            echo "::error::Vault 'service_role_key' is not the legacy service_role JWT (starts with '${prefix:-nothing}'). Put the legacy key in Vault first, or the cron jobs get 401."
            exit 1
          fi
          echo "- Cron key: legacy JWT ✓" >> "$GITHUB_STEP_SUMMARY"

      - name: Backup → private Storage bucket "backups"
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/backup"; mkdir -p "$dir"
          supabase db dump --linked -f "$dir/schema.sql"
          supabase db dump --linked --data-only -f "$dir/data.sql"
          test -s "$dir/schema.sql" && test -s "$dir/data.sql"
          name="kais-flow-$(date -u +%Y-%m-%dT%H%MZ)-$LABEL.tar.gz"; name="${name//\//-}"
          tar -czf "$RUNNER_TEMP/$name" -C "$dir" schema.sql data.sql

          key="$(curl -fsS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '[.[] | select(.name == "service_role")][0].api_key // empty')"
          if [ -z "$key" ]; then echo "::error::No legacy service_role key on the project."; exit 1; fi
          echo "::add-mask::$key"
          storage="https://$PROJECT_REF.supabase.co/storage/v1"
          auth=(-H "Authorization: Bearer $key" -H "apikey: $key")

          # A missing bucket answers 400 here, not 404. Created private with no policies: only the service role reads it.
          if [ "$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "$storage/bucket/backups")" != 200 ]; then
            curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -X POST "$storage/bucket" \
              -d '{"id":"backups","name":"backups","public":false}' > /dev/null
          fi
          curl -sS --fail-with-body "${auth[@]}" -H 'Content-Type: application/gzip' -X POST \
            --data-binary @"$RUNNER_TEMP/$name" "$storage/object/backups/$name" > /dev/null
          echo "- Backup: Storage → \`backups/$name\` ($(du -h "$RUNNER_TEMP/$name" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Database migrations
        run: |
          set -euo pipefail
          supabase migration list --linked
          supabase db push --linked --include-all --skip-vault --yes
          supabase migration list --linked
          echo "- Database: migrations pushed ✓" >> "$GITHUB_STEP_SUMMARY"

      - name: Edge functions
        run: |
          set -euo pipefail
          for f in $FUNCTIONS; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api
          done
          echo "- Functions: $FUNCTIONS ✓" >> "$GITHUB_STEP_SUMMARY"

      - name: Ship the app (push the merge to master)
        id: ship
        run: |
          git push origin master
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait until the live site serves this commit
        run: |
          want="$(git rev-parse HEAD)"
          for i in $(seq 1 40); do
            live="$(curl -fsS -A "Mozilla/5.0 (X11; Linux x86_64) kais-flow-ci" "$APP_URL/version.json?t=$(date +%s)" 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ "$live" = "$want" ]; then
              echo "- App: live at \`${want:0:7}\` → $APP_URL/version.json ✓" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::The live site still serves '${live:-nothing}' after 10 minutes, expected ${want:0:7}. Check Cloudflare → Workers Builds."
          exit 1

      # Auth links + email (docs/EMAIL.md). Kai 2026-10-04: a new account's confirmation link went to
      # http://localhost:3000 — the hosted project still had Supabase's factory Site URL, and the app's
      # emailRedirectTo is ignored unless it's on the redirect allow-list. So every release sets the Site
      # URL + allow-list to the real app and sends the branded templates from config.toml. Gmail SMTP and
      # the Confirm email switch still wait for the SMTP_USER / SMTP_PASS secrets. Only these fields are
      # PATCHed: `supabase config push` would overwrite the password minimum and providers too.
      - name: Auth links + email (Site URL, redirects, templates; Gmail SMTP when its secrets exist)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          set -euo pipefail
          HAS_SMTP=no; [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ] && HAS_SMTP=yes
          export HAS_SMTP
          body="$RUNNER_TEMP/auth-email.json"
          python3 - > "$body" <<'PY'
          import json, os, re, tomllib
          auth = tomllib.load(open("supabase/config.toml", "rb"))["auth"]
          email, smtp = auth["email"], auth["email"]["smtp"]
          env = lambda v: re.sub(r"^env\((\w+)\)$", lambda m: os.environ[m.group(1)], v)
          app = os.environ["APP_URL"].rstrip("/")
          body = {
              # Where auth emails send people: the live app, and each shell's own origin.
              "site_url": app,
              "uri_allow_list": ",".join([f"{app}/**", "https://localhost/**", "http://tauri.localhost/**", "tauri://localhost/**"]),
          }
          if os.environ["HAS_SMTP"] == "yes":
              body.update({
                  "smtp_host": smtp["host"], "smtp_port": str(smtp["port"]),
                  # Google shows an App Password in groups of four; the spaces aren't part of it.
                  "smtp_user": env(smtp["user"]), "smtp_pass": env(smtp["pass"]).replace(" ", ""),
                  "smtp_admin_email": env(smtp["admin_email"]), "smtp_sender_name": smtp["sender_name"],
                  "rate_limit_email_sent": auth["rate_limit"]["email_sent"],
                  "mailer_autoconfirm": not email["enable_confirmations"],
              })
          for name, t in email["template"].items():  # content_path: relative to the repo root
              body[f"mailer_subjects_{name}"] = t["subject"]
              body[f"mailer_templates_{name}_content"] = open(t["content_path"], encoding="utf-8").read()
          for name, n in email["notification"].items():  # content_path: relative to supabase/
              body[f"mailer_notifications_{name}_enabled"] = n["enabled"]
              body[f"mailer_subjects_{name}_notification"] = n["subject"]
              body[f"mailer_templates_{name}_notification_content"] = open(os.path.join("supabase", n["content_path"]), encoding="utf-8").read()
          print(json.dumps(body))
          PY
          patch() { curl -sS -o "$RUNNER_TEMP/auth-email-reply.json" -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @"$1"; }
          why() { jq -r '.message // .error // "no message"' "$RUNNER_TEMP/auth-email-reply.json" 2>/dev/null; }
          code="$(patch "$body")"
          if [ "${code:0:1}" != 2 ] && [ "$HAS_SMTP" = no ]; then
            # Without custom SMTP Supabase may refuse template edits; the links are what must land.
            echo "::warning::Supabase refused the branded templates without custom SMTP ($code): $(why). Setting the links only."
            jq '{site_url, uri_allow_list}' "$body" > "$body.links" && mv "$body.links" "$body"
            code="$(patch "$body")"
          fi
          rm -f "$body"
          if [ "${code:0:1}" != 2 ]; then
            # The reply to a failed PATCH is an error message; the success reply (the whole config) is never printed.
            echo "::error::Supabase refused the auth settings ($code): $(why)"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/auth-email-reply.json"
          if [ "$HAS_SMTP" = yes ]; then
            confirm="$(python3 -c 'import tomllib; print("on" if tomllib.load(open("supabase/config.toml","rb"))["auth"]["email"]["enable_confirmations"] else "off")')"
            echo "- Auth: links → $APP_URL ✓, Gmail SMTP + branded templates ✓, Confirm email $confirm" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Auth: links → $APP_URL ✓, branded templates sent; Supabase's built-in sender until SMTP_USER / SMTP_PASS exist (docs/EMAIL.md)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # A GitHub Release per version (tag at the live master commit, generated notes), then the Android
  # APK and Windows installer built from the same tree and attached to it. A release made with
  # GITHUB_TOKEN can't start other workflows, so the builds are called from here.
  publish:
    name: GitHub Release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.deploy.outputs.label }}
          SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*) ;; *) echo "::notice::'$TAG' is not a version tag, so no GitHub Release"; exit 0 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then exit 0; fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$SHA" --title "Kai's Flow $TAG"             --generate-notes --notes "Live at $APP_URL · Android APK and Windows installer attached below once built (docs/INSTALL.md)."
          echo "- GitHub Release: $TAG" >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: publish
    if: needs.publish.outputs.tag != ''
    uses: ./.github/workflows/android.yml
    permissions:
      contents: write
    # The keystore secrets (ANDROID_KEYSTORE_B64/_PASSWORD) must reach the called workflow, or every
    # release APK gets a one-off key and Android refuses to update over the previous install.
    secrets: inherit
    with:
      tag: ${{ needs.publish.outputs.tag }}

  desktop:
    needs: publish
    if: needs.publish.outputs.tag != ''
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.publish.outputs.tag }}
