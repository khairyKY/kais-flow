<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kai's Flow — tasks, calendar, routines, and journal in one place." />
    <title>Kai's Flow</title>
    <script>
      // Apply saved theme before first paint — no flash of day for night users.
      try { document.documentElement.dataset.theme = localStorage.getItem('kf_theme') === 'night' ? 'night' : 'day' } catch (e) {}
      // Same deal for UI scale — applied pre-paint so the app never flashes at the wrong size.
      // Keep the allowed values in sync with UI_SCALES in src/lib/uiScale.ts.
      try {
        var s = Number(localStorage.getItem('kf_ui_scale'))
        if ([1, 1.1, 1.25, 1.5, 1.75].indexOf(s) === -1) s = 1.25
        if (s !== 1) document.documentElement.style.zoom = String(s)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
