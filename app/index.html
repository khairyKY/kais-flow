<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kai's Flow — tasks, calendar, routines, and journal in one place." />
    <title>Kai's Flow</title>
    <script>
      // Apply saved theme before first paint — no flash of day for night users.
      try { document.documentElement.dataset.theme = localStorage.getItem('kf_theme') === 'night' ? 'night' : 'day' } catch (e) {}
      // Same deal for UI scale — applied pre-paint so the app never flashes at the wrong size.
      // Keep the allowed values and the default rule in sync with src/lib/uiScale.ts
      // (UI_SCALES, defaultUiScale): a saved choice wins; otherwise 100% on a phone or a
      // touch-first screen (coarse primary pointer, or a screen whose short side is < 600 CSS px)
      // and 125% on a computer.
      try {
        var rawScale = null
        try { rawScale = localStorage.getItem('kf_ui_scale') } catch (e) {}
        var s = rawScale === null || rawScale === '' ? NaN : Number(rawScale)
        if ([1, 1.1, 1.25, 1.5, 1.75].indexOf(s) === -1) {
          var coarse = false
          try { coarse = window.matchMedia('(pointer: coarse)').matches } catch (e) {}
          var short = Math.min(screen.width || 0, screen.height || 0)
          s = coarse || (short > 0 && short < 600) ? 1 : 1.25
        }
        if (s !== 1) document.documentElement.style.zoom = String(s)
        document.documentElement.style.setProperty('--kf-ui-scale', String(s))
      } catch (e) {}
      // Paper texture (punch 53) — same pre-paint treatment so the grain never flashes at the
      // default before the Settings value loads. Consumed by body::before in src/index.css.
      // punch 57: the null check is load-bearing — Number(null) is 0, so without it every
      // device that has never touched the slider booted with --kf-grain-opacity: 0 and lost
      // the grain in BOTH themes. Unset must fall through to index.css's 0.5 default.
      try {
        var raw = localStorage.getItem('kf_grain')
        var g = Number(raw)
        if (raw !== null && Number.isFinite(g) && g >= 0 && g <= 100) {
          document.documentElement.style.setProperty('--kf-grain-opacity', String(g / 100))
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
