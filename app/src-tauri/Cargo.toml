[package]
name = "kais-flow"
version = "1.0.0"
description = "Kai's Flow — the whole day in one calm place"
edition = "2021"
publish = false

# The native shell (docs/phases/M1-android.md): the same built dist/ the web app serves, wrapped
# in the system WebView. No app logic lives here.
[lib]
name = "kais_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
