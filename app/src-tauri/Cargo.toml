[package]
name = "kais-flow"
version = "1.0.0"
description = "Kai's Flow — the whole day in one calm place"
edition = "2021"
publish = false
# Proprietary — see the repo-root LICENSE (Cargo wants an SPDX id or a file; there is no SPDX id for "all rights reserved").
license-file = "../../LICENSE"

# The native shell (docs/phases/M1-android.md): the same built dist/ the web app serves, wrapped
# in the system WebView. No app logic lives here — on Windows it also keeps the tray (src/tray.rs).
[lib]
name = "kais_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Links to other sites open in the system browser (lib/platform.ts openExternal): the WebView drops
# window.open and target="_blank".
tauri-plugin-opener = "2"
# generate_context! writes tauri.conf.json's `plugins` (the updater's) as serde_json values.
serde_json = "1"

# Desktop only: the tray's "Start with Windows", and one running copy (closing to the tray would
# otherwise let a second launch put a second K by the clock).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Updates (docs/MICROSOFT-STORE.md "Updates"): the app fetches the signed installer itself and runs it,
# so it never carries a browser download's Mark-of-the-Web and SmartScreen stays quiet.
tauri-plugin-updater = "2"

# Windows toasts with action buttons (Done · Tomorrow, Break 5 min · Keep going). Tauri's own crate —
# tauri-plugin-notification wraps it but drops the buttons on desktop.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
# The Microsoft Store (MSIX) install: its package identity and its StartupTask (src/tray.rs). The same
# crate tauri-winrt-notification already pulls in, with two more namespaces.
windows = { version = "0.62", features = ["ApplicationModel", "Win32_Storage_Packaging_Appx"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
